<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A0B2E">
<title>હરિવંદના કા રાજા</title>
<meta name="description" content="હરિવંદના કા રાજા — ગણપતિ ઉત્સવ. ગેલેરી, પ્રશ્નોત્તરી, શુભકામનાઓ અને બાપ્પાનાં ૧૦૮ નામ.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Gujarati:wght@500;600;700&family=Noto+Sans+Gujarati:wght@400;500;600&family=Fraunces:opsz,wght@9..144,300..700&display=swap">

<style>
/* ─────────────────────────────────────────────────────────────
   TOKENS — a Patan Patola sari lit by diyas
   ───────────────────────────────────────────────────────────── */
:root{
  --night:    #1A0B2E;   /* deep aubergine-indigo — Bhadrapada night   */
  --night-lo: #0E0619;   /* deeper, for vignette + water               */
  --patola:   #6E0F2A;   /* madder maroon — depth planes, panel ground */
  --marigold: #F5A11B;   /* galgota saffron — light, flame, focus      */
  --kumkum:   #D01B3C;   /* sindoor crimson — accent, progress         */
  --durva:    #1E7A5E;   /* banana-leaf green                          */
  --varakh:   #D9A521;   /* gold foil — the title                      */
  --silk:     #F2E4C9;   /* undyed ivory silk — body text              */
  --silk-dim: #C9B695;

  --serif: 'Noto Serif Gujarati', 'Shruti', 'Nirmala UI', Georgia, serif;
  --sans:  'Noto Sans Gujarati', 'Shruti', 'Nirmala UI', system-ui, sans-serif;
  --latin: 'Fraunces', Georgia, serif;

  --ease-silk: cubic-bezier(.22,.61,.36,1);
}

*,*::before,*::after{ box-sizing:border-box; }

html,body{
  margin:0; padding:0;
  height:100%;
  background:var(--night-lo);
  color:var(--silk);
  font-family:var(--sans);
  overflow:hidden;
  overscroll-behavior:none;
  -webkit-text-size-adjust:100%;
}

body{ text-rendering:optimizeLegibility; }

/* The world. Everything 3D lives here. */
#stage{
  position:fixed; inset:0;
  width:100%; height:100%;
  display:block;
  touch-action:none;      /* we own all gestures */
  z-index:0;
}

/* Readable content floats above the world. Pointer-transparent by default so
   drags reach the canvas; individual controls opt back in. */
#overlay{
  position:fixed; inset:0;
  z-index:2;
  pointer-events:none;
  display:flex; flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 1.1rem) 1.1rem
          calc(env(safe-area-inset-bottom) + 1.1rem);
}

/* ── The mandal's name. Not a header — a nameplate floating in the scene. ── */
#nameplate{
  text-align:center;
  flex:0 0 auto;
  opacity:0;
  transform:translateY(-.5rem);
  transition:opacity 1.1s var(--ease-silk), transform 1.1s var(--ease-silk);
}
#nameplate.lit{ opacity:1; transform:none; }

#nameplate h1{
  margin:0;
  font-family:var(--serif);
  font-weight:700;
  font-size:clamp(1.55rem, 7.2vw, 3.4rem);
  line-height:1.28;
  letter-spacing:.005em;
  /* varakh — gold leaf catching diya light as it drifts */
  background:linear-gradient(100deg,
    #8A5E12 0%,  #D9A521 18%, #FFF0BC 33%, #F5A11B 46%,
    #C08A18 62%, #FFE9A8 78%, #D9A521 92%, #8A5E12 100%);
  background-size:280% 100%;
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent; color:transparent;
  animation:varakh 9s linear infinite;
  filter:drop-shadow(0 2px 14px rgba(245,161,27,.30));
}
@keyframes varakh{
  from{ background-position:  0% 50%; }
  to  { background-position:280% 50%; }
}

#nameplate p{
  margin:.42rem 0 0;
  font-family:var(--latin);
  font-weight:400;
  font-size:clamp(.62rem, 2.5vw, .84rem);
  letter-spacing:.24em;
  color:var(--silk-dim);
  opacity:.82;
}

/* Focus is always visible, in marigold. */
:where(button,a,input,[tabindex]):focus-visible{
  outline:2px solid var(--marigold);
  outline-offset:3px;
}

button{ font:inherit; color:inherit; }

/* ── Loading: one diya, before the world exists ── */
#veil{
  position:fixed; inset:0; z-index:30;
  background:var(--night-lo);
  display:grid; place-items:center;
  transition:opacity .9s var(--ease-silk);
}
#veil.gone{ opacity:0; pointer-events:none; }
#veil .wick{
  width:7px; height:7px; border-radius:50%;
  background:var(--marigold);
  box-shadow:0 0 22px 7px rgba(245,161,27,.55), 0 0 60px 22px rgba(208,27,60,.20);
  animation:wick 2.2s ease-in-out infinite;
}
@keyframes wick{
  0%,100%{ transform:scale(1)   translateY(0);     opacity:.95; }
  50%    { transform:scale(1.28) translateY(-2px); opacity:1; }
}

/* ── No WebGL: the same four destinations, in flat HTML ── */
#noweb{
  position:fixed; inset:0; z-index:50;
  display:none;
  overflow-y:auto;
  padding:2rem 1.25rem 3rem;
  background:
    radial-gradient(120% 80% at 50% 0%, #2A1140 0%, var(--night) 45%, var(--night-lo) 100%);
}
#noweb.on{ display:block; }
#noweb .inner{ max-width:34rem; margin:0 auto; }
#noweb h1{
  font-family:var(--serif); font-weight:700;
  font-size:clamp(1.7rem,8vw,2.6rem); line-height:1.25;
  color:var(--varakh); margin:0 0 .6rem;
}
#noweb > .inner > p{ color:var(--silk-dim); line-height:1.6; margin:0 0 2.4rem; }
#noweb section{
  margin:0 0 2.6rem;
  padding-top:1.5rem;
  border-top:1px solid rgba(217,165,33,.26);
}
#noweb section h2{
  font-family:var(--serif); font-weight:700;
  font-size:clamp(1.25rem,5.5vw,1.7rem);
  color:var(--marigold); margin:0 0 .3rem;
}
#noweb section > p{ color:var(--silk-dim); line-height:1.6; margin:0 0 1rem; }

/* ── The four destinations. Real buttons — but they stay objects lying in
      the scene rather than a bar across it: gold line-art on a pool of
      shade, no container, no border, no divider between them.

      Two flanking columns in both orientations, the way lamps stand
      either side of an idol — the centre line belongs to the lotus and
      nothing is allowed to cross it. Landscape only pushes the columns
      further apart into the width it has spare; a single low row there
      put two of the four buttons directly on top of the flower. ── */
#dock{
  position:fixed;
  left:0; right:0;
  bottom:calc(env(safe-area-inset-bottom) + 9vh);
  z-index:3;
  display:grid;
  grid-template-columns:auto auto;
  /* The third term is a floor under the gap, not a preference: two 5.6rem
     buttons plus a 42vw gap overflows a viewport narrower than about
     340px, and the outer button slides off the screen edge. */
  column-gap:min(42vw, 15rem, calc(100vw - 13.4rem));
  row-gap:1vh;
  justify-content:center;
  opacity:0;
  pointer-events:none;
  /* Same rule as the close button: unlit has to mean unreachable by
     keyboard, not merely transparent. */
  visibility:hidden;
  transition:opacity 1s var(--ease-silk), visibility 0s linear 1s;
}
#dock.lit{
  opacity:1; pointer-events:auto; visibility:visible;
  transition:opacity 1s var(--ease-silk), visibility 0s linear 0s;
}

.dbtn{
  -webkit-appearance:none; appearance:none;
  position:relative;
  display:flex; flex-direction:column; align-items:center;
  gap:.15rem;
  width:5.6rem;
  padding:.5rem .2rem .45rem;
  border:0; background:none;
  color:var(--silk);
  font-family:var(--serif); font-weight:600;
  font-size:clamp(.78rem, 3.4vw, .96rem);
  line-height:1.15;
  text-align:center;
  cursor:pointer;
  transition:color .3s var(--ease-silk), transform .4s var(--ease-silk);
}
/* Ivory on lit water is unreadable, so a soft pool of shade does the work
   a panel would do without becoming a panel. */
.dbtn::before{
  content:'';
  position:absolute; inset:-.2rem -.4rem;
  z-index:-1; border-radius:50%;
  background:radial-gradient(52% 50% at 50% 44%,
    rgba(14,6,25,.82) 0%, rgba(14,6,25,.46) 56%, rgba(14,6,25,0) 100%);
}
.dbtn svg{ display:block; width:2.6rem; height:2.6rem; overflow:visible; }
.dbtn .ico-l{
  fill:none; stroke:var(--varakh); stroke-width:1.5;
  stroke-linecap:round; stroke-linejoin:round;
  transition:stroke .3s var(--ease-silk);
}
.dbtn .ico-f{ fill:var(--varakh); opacity:.22; transition:opacity .3s, fill .3s; }
.dbtn .ico-b{ fill:var(--varakh); opacity:.8; transition:fill .3s; }
.dbtn small{
  display:block;
  font-family:var(--latin); font-weight:400;
  font-size:.64em; color:var(--silk-dim); opacity:.6;
}
.dbtn:hover, .dbtn:focus-visible{ color:var(--marigold); transform:translateY(-.24rem); }
.dbtn:hover .ico-l, .dbtn:focus-visible .ico-l{ stroke:var(--marigold); }
.dbtn:hover .ico-f, .dbtn:focus-visible .ico-f{ fill:var(--marigold); opacity:.4; }
.dbtn:hover .ico-b, .dbtn:focus-visible .ico-b{ fill:var(--marigold); }
.dbtn:active{ transform:translateY(-.06rem) scale(.97); }
.dbtn:focus-visible{ outline:none; }
.dbtn:focus-visible::after{
  content:'';
  position:absolute; inset:.1rem -.1rem;
  border:1px solid var(--marigold);
  border-radius:1.6rem;
  opacity:.8;
}

@media (min-aspect-ratio: 1/1){
  #dock{
    /* Same two columns, driven out to the flanks. A landscape frame is
       all width and no height, so the space either side of the flower is
       the only space there is — and putting the buttons there is what
       lets the camera come close enough for the lotus to fill the frame. */
    column-gap:min(56vw, 44rem, calc(100vw - 16.4rem));
    row-gap:1.1rem;
    bottom:calc(env(safe-area-inset-bottom) + 1.6rem);
  }
  .dbtn{ width:7rem; font-size:1.02rem; gap:.3rem; }
  .dbtn svg{ width:3.2rem; height:3.2rem; }
  .dbtn::before{ inset:-.35rem -.6rem; }
}
@media (prefers-reduced-motion: reduce){
  .dbtn{ transition:color .2s; }
  .dbtn:hover, .dbtn:focus-visible, .dbtn:active{ transform:none; }
}

/* ── Return. The only control that persists — a floating lotus, not a bar. ── */
#back{
  position:fixed;
  left:50%; bottom:calc(env(safe-area-inset-bottom) + 1.15rem);
  z-index:14;
  transform:translateX(-50%) translateY(1.4rem) scale(.9);
  width:3.4rem; height:3.4rem;
  display:grid; place-items:center;
  border:0; border-radius:50%;
  background:rgba(14,6,25,.62);
  backdrop-filter:blur(6px);
  cursor:pointer;
  opacity:0; pointer-events:none;
  /* Hidden means hidden to the keyboard too. Fading it out with opacity
     alone leaves an invisible button in the tab order, which is where a
     keyboard user's focus silently disappears to. Visibility flips only
     after the fade has been seen. */
  visibility:hidden;
  transition:opacity .4s var(--ease-silk), transform .4s var(--ease-silk),
             visibility 0s linear .4s;
}
#back.on{
  opacity:1; pointer-events:auto; visibility:visible;
  transform:translateX(-50%) translateY(0) scale(1);
  transition:opacity .4s var(--ease-silk), transform .4s var(--ease-silk),
             visibility 0s linear 0s;
}
#back:hover{ transform:translateX(-50%) scale(1.07); }
#back svg{ width:2.05rem; height:2.05rem; display:block; }

/* ─────────────────────────────────────────────────────────────
   PANELS — each section brings its own physical form, so they
   never collapse into four identical cards. This is only the
   shared shell: scrim, placement, scrolling, heading.
   ───────────────────────────────────────────────────────────── */
/* Visibility is deferred on close so the fade-out is actually seen,
   rather than the content vanishing the instant the class drops. */
#panel{
  position:fixed; inset:0; z-index:12;
  visibility:hidden; pointer-events:none;
  transition:visibility 0s linear .55s;
}
#panel.open{ visibility:visible; transition-delay:0s; }

#panel .scrim{
  position:absolute; inset:0;
  pointer-events:auto;
  background:radial-gradient(125% 100% at 50% 38%,
    rgba(26,11,46,.42) 0%, rgba(14,6,25,.88) 68%, rgba(14,6,25,.97) 100%);
  opacity:0;
  transition:opacity .55s var(--ease-silk);
}
#panel.open .scrim{ opacity:1; }

#panel .sheet{
  position:absolute;
  pointer-events:auto;
  overflow-y:auto;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  opacity:0;
  transition:opacity .5s var(--ease-silk), transform .55s var(--ease-silk);
}
/* portrait: the sheet rises from below and the lotus dims behind it */
#panel .sheet{
  left:0; right:0;
  bottom:0; top:16vh;
  padding:1.5rem 1.15rem calc(env(safe-area-inset-bottom) + 5.6rem);
  transform:translateY(4vh);
}
#panel.open .sheet{ opacity:1; transform:none; }

/* landscape: the sheet takes the right, and the camera slides the
   lotus left so he stays in view rather than being covered */
@media (min-aspect-ratio: 1/1){
  #panel .scrim{
    background:linear-gradient(90deg,
      rgba(14,6,25,0) 0%, rgba(14,6,25,.30) 38%, rgba(14,6,25,.90) 58%, rgba(14,6,25,.96) 100%);
  }
  #panel .sheet{
    left:auto; right:0; top:0; bottom:0;
    width:min(30rem, 48vw);
    padding:2.2rem 2rem 2.6rem;
    transform:translateX(2.5rem);
  }
  /* In portrait the sheet starts at 16vh and clears the nameplate. In
     landscape it starts at the top edge, so the section's own title
     lands straight on the mandal's name — 326×42px of it. The nameplate
     belongs to the darshan, so it steps aside while you're reading,
     exactly as the dock does, and comes back when you close. */
  body.reading #nameplate{
    opacity:0;
    transform:translateY(-.5rem);
    pointer-events:none;
  }
}

.sheet-in{ max-width:34rem; margin:0 auto; }

#panelTitle{
  margin:0 0 .1rem;
  font-family:var(--serif);
  font-weight:700;
  font-size:clamp(1.4rem, 6vw, 2.1rem);
  line-height:1.25;
  color:var(--varakh);
}
#panelSub{
  margin:0 0 1.5rem;
  font-size:.9rem;
  line-height:1.5;
  color:var(--silk-dim);
  max-width:32rem;
}

/* ── Shared text rhythm inside panels ── */
.sheet p{ line-height:1.62; max-width:34rem; }
.sheet a{ color:var(--marigold); }

/* ═══ ૧૦૮ નામ ═══════════════════════════════════════════════════
   A mala is counted one bead at a time under the thumb, and the
   thread is the only progress bar it has ever needed. So the thread
   is the interface: 108 beads you can scroll, tap or arrow through,
   with the one under your thumb lit. No cards, no percentage.
   ═══════════════════════════════════════════════════════════════ */
.mala-head{
  display:flex; align-items:baseline; justify-content:space-between;
  gap:1rem; margin:0 0 .85rem;
}
.mala-count{
  font-family:var(--serif); font-weight:700;
  font-size:1.7rem; line-height:1; color:var(--varakh);
  font-variant-numeric:tabular-nums;
}
.mala-count i{
  font-style:normal; font-weight:400;
  font-size:.62em; color:var(--silk-dim); margin-inline-start:.15em;
}

/* the thread itself — beads strung on a hairline, scrolling sideways */
.thread{
  position:relative;
  display:flex; align-items:center; gap:.30rem;
  overflow-x:auto; overscroll-behavior-x:contain;
  scrollbar-width:none;
  padding:.9rem .25rem 1rem;
  margin:0 -1.15rem 1.4rem;
  padding-inline:1.15rem;
  /* the string runs behind the beads and fades out at both ends, so it
     reads as a loop continuing past the edge rather than a cut bar */
  background:linear-gradient(90deg,
    rgba(217,165,33,0) 0, rgba(217,165,33,.34) 8%,
    rgba(217,165,33,.34) 92%, rgba(217,165,33,0) 100%) center/100% 1px no-repeat;
  -webkit-mask-image:linear-gradient(90deg, transparent 0, #000 6%, #000 94%, transparent 100%);
  mask-image:linear-gradient(90deg, transparent 0, #000 6%, #000 94%, transparent 100%);
}
.thread::-webkit-scrollbar{ display:none; }

.bead{
  position:relative;
  flex:0 0 auto;
  width:.62rem; height:.62rem;
  border:1px solid rgba(242,228,201,.36);
  border-radius:50%;
  background:rgba(14,6,25,.6);
  cursor:pointer;
  transition:background .25s var(--ease-silk), border-color .25s var(--ease-silk),
             width .3s var(--ease-silk), height .3s var(--ease-silk),
             box-shadow .3s var(--ease-silk);
}
/* a real bead is small, and this one is a scrubber rather than the
   primary control — so the dot stays bead-sized and the touch target
   grows invisibly around it to something a thumb can actually hit */
.bead::after{ content:''; position:absolute; inset:-.8rem -.18rem; }
/* every 27th — a real mala is marked in quarters, and without them
   108 identical dots give you no idea how far along you are */
.bead.mark{ width:.82rem; height:.82rem; border-color:rgba(217,165,33,.6); }
/* beads already told */
.bead.told{ background:var(--kumkum); border-color:transparent; }
/* the one under your thumb */
.bead.now{
  width:1.15rem; height:1.15rem;
  background:var(--marigold); border-color:var(--varakh);
  box-shadow:0 0 0 .22rem rgba(245,161,27,.18), 0 0 .9rem rgba(245,161,27,.55);
}
/* the guru bead, where a recitation begins and ends */
.bead.guru{
  width:1.25rem; height:1.25rem;
  border-color:var(--varakh); border-width:2px;
  background:radial-gradient(circle at 38% 34%, #F6D88A 0%, #9A6B14 100%);
}

/* the name, set as an inscription rather than a card */
.face{
  -webkit-appearance:none; appearance:none;
  display:block; width:100%;
  border:0; background:none; padding:.4rem 0 1.2rem;
  color:inherit; text-align:center; cursor:pointer;
  font:inherit;
}
.face .om{
  display:block; font-family:var(--serif);
  font-size:1.7rem; line-height:1; color:var(--varakh); opacity:.78;
  margin:0 0 .55rem;
}
.face .nm{
  display:block;
  font-family:var(--serif); font-weight:700;
  font-size:clamp(2rem, 10vw, 3.1rem);
  line-height:1.22; color:var(--silk);
  margin:0 0 .35rem;
  text-shadow:0 0 2.2rem rgba(245,161,27,.24);
}
.face .rm{
  display:block; font-family:var(--latin); font-weight:400;
  font-size:.98rem; letter-spacing:.02em;
  color:var(--marigold); opacity:.9; margin:0 0 .9rem;
}
.face .mn{
  display:block; font-family:var(--sans);
  font-size:1rem; line-height:1.6; color:var(--silk-dim);
  max-width:26rem; margin:0 auto;
}
.face:focus-visible{ outline:2px solid var(--marigold); outline-offset:6px; border-radius:.5rem; }
/* the name swaps with a small settle, the way a bead drops into place */
.face.turn .nm, .face.turn .rm, .face.turn .mn{ animation:bead-turn .34s var(--ease-silk); }
@keyframes bead-turn{ from{ opacity:0; transform:translateY(.42rem); } }

.mala-nav{ display:flex; align-items:center; justify-content:center; gap:.9rem; }
/* "આગળ" is pressed 108 times and "પાછળ" almost never, so only one of
   them is given any weight. Two matching buttons would be a lie about
   how this is actually used. */
.turn-next{
  -webkit-appearance:none; appearance:none;
  flex:1 1 auto; max-width:15rem;
  padding:.85rem 1.4rem;
  border:1px solid var(--varakh); border-radius:2rem;
  background:linear-gradient(180deg, rgba(245,161,27,.22), rgba(217,165,33,.09));
  color:var(--silk);
  font-family:var(--serif); font-weight:600; font-size:1.05rem;
  cursor:pointer;
  transition:background .3s var(--ease-silk), color .3s, transform .25s var(--ease-silk);
}
.turn-next:hover, .turn-next:focus-visible{
  background:linear-gradient(180deg, rgba(245,161,27,.38), rgba(217,165,33,.16));
  color:#fff;
}
.turn-next:active{ transform:scale(.975); }
.quiet{
  -webkit-appearance:none; appearance:none;
  border:0; background:none; cursor:pointer;
  padding:.85rem .55rem;
  font-family:var(--sans); font-size:.92rem;
  color:var(--silk-dim);
  transition:color .25s var(--ease-silk), opacity .25s;
}
.quiet:hover, .quiet:focus-visible{ color:var(--marigold); }
.quiet[disabled]{ opacity:.3; cursor:default; }
.turn-next:focus-visible, .quiet:focus-visible{ outline:2px solid var(--marigold); outline-offset:3px; }

/* the list, for reading rather than reciting */
.mala-list{ list-style:none; margin:0; padding:0; }
.mala-list li{
  display:grid;
  grid-template-columns:2.6rem 1fr;
  gap:.2rem .8rem;
  padding:.7rem 0;
  border-top:1px solid rgba(242,228,201,.10);
}
.mala-list li:first-child{ border-top:0; }
.mala-list .n{
  grid-row:1 / span 2;
  font-family:var(--serif); font-size:.95rem; color:var(--varakh);
  opacity:.65; text-align:end; padding-top:.12rem;
}
.mala-list .g{ font-family:var(--serif); font-weight:600; font-size:1.15rem; color:var(--silk); }
.mala-list .g em{
  font-style:normal; font-family:var(--latin);
  font-size:.78rem; color:var(--marigold); opacity:.85;
  margin-inline-start:.55rem;
}
.mala-list .m{ font-family:var(--sans); font-size:.9rem; line-height:1.5; color:var(--silk-dim); }
.mala-list li.told .n{ opacity:1; color:var(--kumkum); }

/* reaching ૧૦૮ */
.aarti-done{
  margin:1.4rem 0 0; padding:1.3rem 1rem;
  text-align:center;
  border-top:1px solid rgba(217,165,33,.34);
  background:radial-gradient(80% 120% at 50% 0%, rgba(245,161,27,.16), transparent 70%);
}
.aarti-done b{
  display:block; font-family:var(--serif); font-weight:700;
  font-size:1.45rem; color:var(--varakh); margin:0 0 .4rem;
}
.aarti-done span{ font-family:var(--sans); font-size:.95rem; color:var(--silk-dim); }

.src-note{
  margin:1.6rem 0 0; padding-top:.9rem;
  border-top:1px solid rgba(242,228,201,.08);
  font-family:var(--sans); font-size:.78rem; line-height:1.55;
  color:var(--silk-dim); opacity:.62;
}

/* ═══ પ્રશ્નોત્તરી ═══════════════════════════════════════════════
   Not a test — a thali of ten modaks, and you take one at a time.
   Deliberately built from a different vocabulary than the mala: the
   mala is a thread of small round things, this is a stack of wide
   offered rows. Shared with the mala only where sharing is honest —
   the bead, because a count of ten is still a count.

   The two answer states carry one meaning each and never overlap:
   varakh gold is always where the truth was, kumkum always marks
   what your own hand chose. Green is not used. Correct and wrong
   both light up — kumkum is auspicious, not a failing mark.
   ═══════════════════════════════════════════════════════════════ */
.q-head{
  display:flex; align-items:center; justify-content:space-between;
  gap:1rem; margin:0 0 1.25rem;
}

/* ten beads, filling as you go — gold where you were right,
   kumkum where you weren't, a marigold ring on the one at hand */
.q-track{ display:flex; align-items:center; gap:.42rem; }
.q-dot{
  width:.6rem; height:.6rem; border-radius:50%;
  border:1px solid rgba(242,228,201,.30);
  background:transparent;
  transition:background .3s var(--ease-silk), border-color .3s var(--ease-silk),
             transform .3s var(--ease-silk);
}
.q-dot.right{ background:var(--varakh); border-color:transparent; }
.q-dot.wrong{ background:var(--kumkum); border-color:transparent; }
.q-dot.at{
  transform:scale(1.5);
  border-color:var(--marigold);
  box-shadow:0 0 9px rgba(245,161,27,.5);
}
.q-of{
  font-family:var(--serif); font-weight:700;
  font-size:1.05rem; color:var(--silk-dim);
  font-variant-numeric:tabular-nums; white-space:nowrap;
}

/* the question sits on a banana leaf — a torn organic edge, nothing
   like the sheet's own rectangle, and no border-radius token shared
   with anything else in the file.

   The scrim behind the panel is deliberately open at the centre so
   Bappa stays visible, which means every reading surface in here has
   to carry its own opacity. Text over a translucent leaf over his
   face is unreadable — so the leaf is nearly solid, and he shows in
   the margins around it instead. */
.q-leaf{
  position:relative;
  margin:0 0 1.15rem; padding:1.3rem 1.25rem 1.4rem;
  border-radius:1.6rem .4rem 1.7rem .5rem;
  background:
    linear-gradient(158deg, rgba(30,122,94,.26) 0%, rgba(30,122,94,.12) 55%, rgba(110,15,42,.22) 100%),
    rgba(16,7,29,.93);
  box-shadow:inset 0 1px 0 rgba(242,228,201,.07);
}
/* the leaf's midrib */
.q-leaf::before{
  content:''; position:absolute; left:1.25rem; right:1.25rem; top:0;
  height:1px;
  background:linear-gradient(90deg, transparent, rgba(30,122,94,.55) 22%, rgba(30,122,94,.55) 78%, transparent);
}
.q-leaf h3{
  margin:0;
  font-family:var(--serif); font-weight:600;
  font-size:clamp(1.12rem, 4.6vw, 1.34rem);
  line-height:1.5; color:var(--silk);
}

/* the offered answers */
.q-opts{ display:grid; gap:.6rem; margin:0 0 1.1rem; }
.q-opt{
  position:relative;
  display:flex; align-items:center; gap:.85rem;
  width:100%; padding:.92rem 1.05rem;
  text-align:start;
  font-family:var(--sans); font-size:1.02rem; line-height:1.42;
  color:var(--silk);
  /* opaque for the same reason the leaf is: these sit over his face */
  background:rgba(22,10,39,.90);
  border:1px solid rgba(242,228,201,.16);
  border-radius:.7rem;
  cursor:pointer;
  transition:background .22s var(--ease-silk), border-color .22s var(--ease-silk),
             color .22s var(--ease-silk), transform .16s var(--ease-silk);
}
.q-opt:hover:not([disabled]){
  background:rgba(58,28,16,.92);
  border-color:rgba(245,161,27,.52);
}
.q-opt:active:not([disabled]){ transform:scale(.99); }

/* the modak on each row: a little pleated dumpling, drawn rather than
   clipped so the focus ring stays a clean rectangle around the row.
   Kept to a silhouette plus two pleats — at 1.5rem, any more detail
   collapses into a blob and it stops reading as a modak at all. */
.q-opt .mk{
  flex:0 0 auto; width:1.5rem; height:1.5rem;
  opacity:.55;
  transition:opacity .22s var(--ease-silk), transform .34s var(--ease-silk);
}
.q-opt .mk path{ fill:none; stroke:currentColor; stroke-width:1.5; stroke-linejoin:round; stroke-linecap:round; }
.q-opt:hover:not([disabled]) .mk{ opacity:.95; }

/* answered: gold is the truth, kumkum is your hand */
.q-opt.is-right{
  background:rgba(62,44,10,.94);
  border-color:var(--varakh);
  color:#FFF0BC;
}
.q-opt.is-right .mk{ opacity:1; }
.q-opt.is-right .mk path{ fill:rgba(217,165,33,.42); }
.q-opt.is-mine{
  background:rgba(63,14,27,.94);
  border-color:var(--kumkum);
}
.q-opt.is-mine .mk{ opacity:1; }
.q-opt.is-mine .mk path{ fill:rgba(208,27,60,.40); }
.q-opt[disabled]{ cursor:default; }
/* the two that were never in it recede, but stay legible — they are
   still part of the question you just read */
.q-opt.is-dim{ background:rgba(18,8,32,.82); border-color:rgba(242,228,201,.08); color:var(--silk-dim); }
.q-opt.is-dim .mk{ opacity:.28; }
.q-opt.is-right .mk{ animation:modak-take .42s var(--ease-silk); }
@keyframes modak-take{
  0%  { transform:scale(1); }
  45% { transform:scale(1.28) rotate(-7deg); }
  100%{ transform:scale(1); }
}

/* why — the teaching line. An aside, not an error box: no icon, no
   red panel, just a kumkum rule and the fact you were missing. */
.q-why{
  margin:0 0 1.15rem; padding:.7rem .9rem .7rem 1rem;
  border-inline-start:2px solid var(--kumkum);
  background:rgba(16,7,29,.88);
  font-family:var(--sans); font-size:.95rem; line-height:1.6;
  color:var(--silk-dim);
}
.q-why b{ color:var(--silk); font-weight:500; }

/* The lotus glyph that returns you to the darshan is pinned low-centre
   and floats above the panel, so the centre of the bottom edge is a
   lane the panel's own controls must stay out of. The sheet's bottom
   padding only clears that lane once you've scrolled to the end — and
   this question is short enough to sit still — so the button hugs the
   right at its own width instead of growing across the middle. */
.q-nav{ display:flex; align-items:center; justify-content:flex-end; gap:.9rem; }
.q-nav .turn-next{ flex:0 0 auto; }

/* ── the score ── */
.q-score{ text-align:center; padding:.5rem 0 0; }
.q-score .tally{
  font-family:var(--serif); font-weight:700;
  font-size:clamp(3.2rem, 17vw, 4.6rem); line-height:1;
  color:var(--varakh);
  font-variant-numeric:tabular-nums;
}
.q-score .tally i{
  font-style:normal; font-weight:400;
  font-size:.34em; color:var(--silk-dim); margin-inline-start:.1em;
}
.q-score .bless{
  margin:1rem auto 0; max-width:26rem;
  font-family:var(--serif); font-weight:600;
  font-size:1.22rem; line-height:1.55; color:var(--silk);
}
/* The score screen is short, so the scrim's open centre leaves Bappa
   fully visible behind it — and a button parked on his face is not
   something to ship. The blessing ends above him and the button drops
   below, so he sits in the gap between them rather than under anything. */
.q-score .again{ margin-top:min(34vh, 16rem); }

/* ═══ શુભકામનાઓ ═════════════════════════════════════════════════
   A third vocabulary, deliberately not the other two. The mala is a
   thread of small round things; the quiz is a stack of wide offered
   rows; this is one large object you strike, and one square card you
   hand to somebody. So: a bell with a lot of air around it, the
   blessing unrolling underneath as a scroll band — square corners and
   gold rules, borrowing no radius from the leaf — and then a real
   1080×1080 card, because a festival wish that can't go to WhatsApp
   isn't finished.

   The two halves are one gesture, not two tools: the blessing you were
   just given is the blessing that goes on the card. You receive, then
   you pass it on.
   ═══════════════════════════════════════════════════════════════ */
.w-bell{ text-align:center; padding:.4rem 0 0; }
/* The bell is open line-art, and the scrim is deliberately open at the
   centre — so without this, Bappa's face reads straight through the
   bell's mouth. A pool of shade, the same device the dock glyphs sit
   on, makes it one object hanging in front of the darshan rather than
   a drawing laid over him. */
.bell-btn{
  -webkit-appearance:none; appearance:none;
  border:0; padding:1.1rem 2.2rem .9rem; cursor:pointer;
  display:inline-block; line-height:0;
  border-radius:50% / 46%;
  background:radial-gradient(58% 54% at 50% 46%,
    rgba(14,6,25,.93) 0%, rgba(14,6,25,.80) 58%, rgba(14,6,25,0) 100%);
  -webkit-tap-highlight-color:transparent;
}
.bell-btn:focus-visible{ outline:2px solid var(--marigold); outline-offset:4px; border-radius:.6rem; }
.bell-svg{
  width:clamp(7rem, 34vw, 9.5rem); height:auto;
  transform-origin:50% 2%;
  overflow:visible;
}
.bell-svg .br{ fill:none; stroke:var(--varakh); stroke-width:2.4; stroke-linejoin:round; stroke-linecap:round; }
.bell-svg .cl{ fill:var(--marigold); stroke:none; }
.bell-svg .bd{ fill:none; stroke:var(--marigold); stroke-width:1.8; opacity:.7; }
/* the halo sits behind and only warms up while it rings */
.bell-svg .ha{ fill:url(#bellGlow); opacity:0; transition:opacity .5s var(--ease-silk); }
.bell-svg .wv{ fill:none; stroke:var(--marigold); stroke-width:2; stroke-linecap:round; opacity:0; }

.bell-btn:hover .bell-svg .br{ stroke:#F2D98A; }
.bell-btn.ring .bell-svg{ animation:ghanta 1.7s var(--ease-silk); }
.bell-btn.ring .bell-svg .ha{ opacity:.9; }
.bell-btn.ring .bell-svg .wv{ animation:wv 1.1s ease-out; }
.bell-btn.ring .bell-svg .wv:nth-of-type(2){ animation-delay:.1s; }

/* a damped pendulum — each swing shorter than the last, which is what
   a struck bell actually does */
@keyframes ghanta{
  0%{   transform:rotate(0deg); }
  11%{  transform:rotate(13deg); }
  29%{  transform:rotate(-9.5deg); }
  47%{  transform:rotate(6.2deg); }
  65%{  transform:rotate(-3.8deg); }
  82%{  transform:rotate(1.9deg); }
  100%{ transform:rotate(0deg); }
}
@keyframes wv{
  0%{   opacity:0; transform:scale(.82); }
  22%{  opacity:.85; }
  100%{ opacity:0; transform:scale(1.22); }
}

.w-hint{
  /* the clapper and the sound arcs paint outside the svg's box, so the
     hint needs more clearance than the measured height suggests */
  margin:1.35rem 0 0; font-family:var(--sans); font-size:.9rem;
  color:var(--silk-dim); opacity:.85;
}

/* ── the blessing, unrolled ── */
.w-bless{
  margin:1.5rem 0 0; padding:1.4rem 1.2rem;
  border-block:1px solid rgba(217,165,33,.40);
  border-radius:0;                    /* a scroll has no rounded corner */
  background:
    linear-gradient(180deg, rgba(110,15,42,.30), rgba(110,15,42,.13)),
    rgba(16,7,29,.92);
  text-align:center;
  font-family:var(--serif); font-weight:600;
  font-size:clamp(1.16rem, 4.6vw, 1.4rem); line-height:1.6;
  color:var(--silk);
  min-height:3.2rem;
}
.w-bless.empty{
  font-family:var(--sans); font-weight:400; font-size:1rem;
  color:var(--silk-dim); background:rgba(16,7,29,.78);
  border-block-color:rgba(242,228,201,.12);
}
.w-bless.turn{ animation:unroll .62s var(--ease-silk); }
@keyframes unroll{
  from{ opacity:0; transform:scaleY(.72); filter:blur(1px); }
  to{   opacity:1; transform:scaleY(1);   filter:blur(0); }
}
.w-again{ display:flex; justify-content:center; margin:.7rem 0 0; }

/* ── passing it on ── */
.w-send{ margin:2.1rem 0 0; }
.w-send > h3{
  margin:0 0 .2rem; font-family:var(--serif); font-weight:600;
  font-size:1.12rem; color:var(--varakh);
}
.w-send > p{
  margin:0 0 1.1rem; font-family:var(--sans); font-size:.92rem;
  line-height:1.55; color:var(--silk-dim);
}
.w-field{ display:block; margin:0 0 1.3rem; }
.w-field span{
  display:block; margin:0 0 .4rem;
  font-family:var(--sans); font-size:.88rem; color:var(--silk-dim);
}
/* an underline, not a box — the card below is the boxy thing, and two
   competing rectangles would fight */
.w-field input{
  -webkit-appearance:none; appearance:none;
  display:block; width:100%; box-sizing:border-box;
  padding:.6rem .2rem; margin:0;
  border:0; border-bottom:1px solid rgba(217,165,33,.5); border-radius:0;
  background:rgba(16,7,29,.55);
  font-family:var(--serif); font-weight:600; font-size:1.2rem;
  color:var(--silk);
  transition:border-color .25s var(--ease-silk), background .25s;
}
/* a placeholder set in the same serif at the same size reads as a name
   already entered — so it steps down to the UI face and lightens */
.w-field input::placeholder{
  color:rgba(201,182,149,.42);
  font-family:var(--sans); font-weight:400; font-size:.95rem;
}
.w-field input:focus{
  outline:0; border-bottom-color:var(--marigold);
  background:rgba(16,7,29,.8);
}

.w-card{
  margin:0 0 1.1rem;
  border:1px solid rgba(217,165,33,.3); border-radius:.5rem;
  overflow:hidden; background:var(--night-lo);
  box-shadow:0 14px 40px rgba(0,0,0,.45);
}
.w-card canvas{ display:block; width:100%; height:auto; }

/* Same lane rule as the quiz: the lotus glyph that returns you to the
   darshan is pinned low-centre above this panel. This content is tall
   enough that you reach the sheet's bottom padding, but the row is kept
   to the right anyway so the two can never meet mid-scroll. */
.w-acts{ display:flex; align-items:center; justify-content:flex-end; gap:.6rem; flex-wrap:wrap; }
.w-acts .turn-next{ flex:0 0 auto; }
.w-note{
  margin:.9rem 0 0; font-family:var(--sans); font-size:.84rem;
  line-height:1.5; color:var(--silk-dim); opacity:.75;
}

/* ═══ ગેલેરી ════════════════════════════════════════════════════
   A fourth vocabulary. The mala is a thread of beads, the quiz a
   stack of offered rows, the wish one struck object and a card —
   this is a wall of photographs, hung.

   Two things decide the form. The photographs are the content, so
   nothing is allowed to compete with them: no captions invented for
   faces I cannot name, no hover captions, no frames heavy enough to
   be looked at. And they are a record of five days in order, so the
   only structure imposed on them is the day they were taken — the
   one fact the photographs themselves carry.
   ═══════════════════════════════════════════════════════════════ */

/* A day is announced the way a page of an album is: the date at the
   left, and a thread of gold running out to the edge — the toran
   strung across a lane, which is what a Ganpati day looks like. */
.g-day{
  display:flex; align-items:baseline; gap:.7rem;
  margin:2.1rem 0 .85rem;
}
.g-day:first-child{ margin-top:.2rem; }
.g-day h3{
  margin:0; flex:0 0 auto;
  font-family:var(--serif); font-weight:600;
  font-size:clamp(1rem, 4vw, 1.15rem);
  color:var(--varakh);
  letter-spacing:.01em;
}
.g-day span{
  flex:1 1 auto; height:1px;
  background:linear-gradient(90deg,
    rgba(217,165,33,.55), rgba(217,165,33,.16) 62%, rgba(217,165,33,0));
}
.g-day small{
  flex:0 0 auto;
  font-family:var(--sans); font-size:.76rem;
  color:var(--silk-dim); opacity:.62;
}

/* Columns, not a grid. A grid of equal cells crops every photograph
   to the same rectangle, which is exactly what a wall of festival
   photos should not do — the portrait shot of the idol and the wide
   shot of four hundred people in the lane are different shapes and
   stay that way. */
.g-wall{
  column-count:2;
  column-gap:.5rem;
  margin:0 0 .3rem;
}
@media (min-width: 30rem){ .g-wall{ column-count:3; column-gap:.6rem; } }

/* The one section that is given more of the screen than the others.
   The rest are text and UI, which read better in a narrow measure —
   but eighty photographs in a 30rem column come out at about 110px
   each, which is a contact sheet, not a gallery. The lotus still has
   the left of the frame; this only spends the empty width beside it. */
@media (min-aspect-ratio: 1/1){
  #panel .sheet.frame-gallery{ width:min(42rem, 58vw); }
  #panel .sheet.frame-gallery .sheet-in{ max-width:42rem; }
}

.g-fr{
  -webkit-appearance:none; appearance:none;
  display:block; width:100%;
  padding:0; margin:0 0 .5rem;
  border:0; background:none;
  /* a photograph is not a card — no radius, no shadow, just the print */
  border-radius:0;
  cursor:zoom-in;
  /* the whole frame must not be split across a column break */
  break-inside:avoid; -webkit-column-break-inside:avoid;
  position:relative;
  line-height:0;
  transition:transform .35s var(--ease-silk);
}
@media (min-width: 30rem){ .g-fr{ margin-bottom:.6rem; } }

.g-fr img{
  display:block; width:100%; height:auto;
  /* Reserved from the real pixel dimensions, so eighty lazy-loading
     photographs do not reflow the wall under your thumb as they land. */
  background:linear-gradient(135deg, rgba(110,15,42,.34), rgba(26,11,46,.6));
  /* a thin brass edge, the way a print is mounted, not a UI border */
  outline:1px solid rgba(217,165,33,.22);
  outline-offset:-1px;
  transition:outline-color .35s var(--ease-silk), filter .35s var(--ease-silk);
}
.g-fr:hover{ transform:translateY(-.2rem); }
.g-fr:hover img, .g-fr:focus-visible img{
  outline-color:var(--marigold);
  filter:brightness(1.06);
}
.g-fr:focus-visible{ outline:none; }
.g-fr:focus-visible img{ outline-width:2px; }

/* A photograph that will not load leaves its frame standing with the
   Patola weave showing through, rather than a broken-image glyph. */
.g-fr.gone img{ visibility:hidden; }
.g-fr.gone{
  background:
    repeating-linear-gradient(45deg,
      rgba(110,15,42,.5) 0 6px, rgba(30,122,94,.28) 6px 12px),
    var(--night-lo);
  outline:1px solid rgba(217,165,33,.22); outline-offset:-1px;
  cursor:default;
}

.g-note{
  margin:1.4rem 0 0; font-family:var(--sans); font-size:.84rem;
  line-height:1.55; color:var(--silk-dim); opacity:.7;
}

/* ── The lightbox ──────────────────────────────────────────────
   Above everything: the lotus glyph at 14, the panel at 12, and the
   no-WebGL page at 50 — the gallery is reachable from that page too,
   and at z-index 20 a photograph opened there rendered underneath
   the wall you tapped it from. While a photograph is open it is the
   only thing on screen, on either path. */
#lens{
  position:fixed; inset:0; z-index:60;
  display:none;
  /* Opaque, not a tinted veil. At 96% the bright photographs on the wall
     behind still ghost through onto a near-black field and you read the
     grid instead of the picture. */
  background:#080310;
  opacity:0;
  transition:opacity .3s var(--ease-silk);
}
#lens.on{ display:block; }
#lens.in{ opacity:1; }

#lens .lens-fig{
  position:absolute; inset:0;
  display:grid; place-items:center;
  padding:3.6rem .5rem 4.6rem;
}
#lens img{
  display:block;
  max-width:100%; max-height:100%;
  width:auto; height:auto;
  object-fit:contain;
  opacity:0;
  transition:opacity .3s var(--ease-silk);
}
#lens img.shown{ opacity:1; }

/* the count, in Gujarati numerals — the one place a number belongs */
#lens .lens-of{
  position:absolute; top:0; left:0; right:0;
  padding:1.05rem 1rem;
  text-align:center;
  font-family:var(--sans); font-size:.84rem;
  color:var(--silk-dim);
  pointer-events:none;
}

/* Round targets, because they sit over the photograph itself and a
   rectangle would read as a second frame inside the first. */
#lens button{
  -webkit-appearance:none; appearance:none;
  position:absolute;
  width:3rem; height:3rem;
  display:grid; place-items:center;
  border:0; border-radius:50%;
  background:rgba(14,6,25,.66);
  backdrop-filter:blur(6px);
  color:var(--varakh);
  cursor:pointer;
  transition:background .25s var(--ease-silk), color .25s var(--ease-silk),
             transform .25s var(--ease-silk);
  -webkit-tap-highlight-color:transparent;
}
#lens button:hover{ background:rgba(110,15,42,.76); color:var(--marigold); }
#lens button:focus-visible{ outline:2px solid var(--marigold); outline-offset:2px; }
#lens button:active{ transform:scale(.94); }
#lens button svg{ width:1.5rem; height:1.5rem; display:block; fill:none;
  stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }

#lens .lens-x{ top:.6rem; right:.6rem; }
/* Left and right sit at the bottom corners, not the vertical middle:
   on a phone the middle of the screen edge is where your thumb is
   already resting on the photograph, and centred arrows land on the
   picture. In the corners they frame it instead. */
#lens .lens-p{ bottom:.9rem; left:.9rem; }
#lens .lens-n{ bottom:.9rem; right:.9rem; }
#lens button[disabled]{ opacity:.3; pointer-events:none; }

@media (min-width: 46rem){
  #lens .lens-fig{ padding:4rem 5rem; }
  #lens .lens-p{ top:50%; bottom:auto; left:1.2rem; transform:translateY(-50%); }
  #lens .lens-n{ top:50%; bottom:auto; right:1.2rem; transform:translateY(-50%); }
  #lens .lens-p:active, #lens .lens-n:active{ transform:translateY(-50%) scale(.94); }
}

function buildRenderer() {
  renderer = new THREE.WebGLRenderer({
    canvas: canvas,
    antialias: tier === TIER.HIGH,
    alpha: false,
    powerPreference: 'high-performance',
    stencil: false
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, Q.maxDpr));
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  /* 0.149 predates the r152 colour-management default. Without this the
     whole scene renders washed out and the golds go muddy. */
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.shadowMap.enabled = Q.shadows;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.setClearColor(col(C.nightLo), 1);
}

/* ── Sky: an inverted sphere with a vertical gradient. Cheaper and more
      controllable than an HDRI, and it keeps the file asset-free. ── */
function buildSky() {
  var geo = new THREE.SphereGeometry(120, 32, 20);
  var mat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    uniforms: {
      cTop: { value: col(C.nightLo) },
      cMid: { value: col('#2E1247') },
      cBot: { value: col(C.patola)  }
    },
    vertexShader: [
      'varying vec3 vP;',
      'void main(){',
      '  vP = position;',
      '  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);',
      '}'
    ].join('\n'),
    fragmentShader: [
      'uniform vec3 cTop; uniform vec3 cMid; uniform vec3 cBot;',
      'varying vec3 vP;',
      'void main(){',
      '  float h = normalize(vP).y;',
      '  vec3 c = mix(cBot, cMid, smoothstep(-0.55, 0.10, h));',
      '  c = mix(c, cTop, smoothstep(-0.05, 0.72, h));',
      /* a faint warm bloom low on the horizon, as if from unseen diyas */
      '  c += vec3(0.115, 0.042, 0.010) * pow(max(0.0, 1.0 - abs(h + 0.13) * 4.6), 3.0);',
      '  gl_FragColor = vec4(c, 1.0);',
      '}'
    ].join('\n')
  });
  sky = new THREE.Mesh(geo, mat);
  sky.frustumCulled = false;
  scene.add(sky);
}

/* ── Water: dark, rippling, with a pool of diya light where the lotus sits.
      All shader work — no reflection pass, which is what makes it viable
      on a phone. ── */
var WATER_SIZE = 56;

function buildWater() {
  var geo = new THREE.PlaneGeometry(WATER_SIZE, WATER_SIZE, 1, 1);
  var mat = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    uniforms: {
      uTime:   { value: 0 },
      uSize:   { value: WATER_SIZE },
      uDeep:   { value: col('#120725') },
      uGlow:   { value: col(C.marigold) },
      uCool:   { value: col('#3A1257') },
      uDetail: { value: Q.waterDetail },
      uReveal: { value: 0 }          /* the intro raises this from 0 */
    },
    vertexShader: [
      'varying vec2 vUv;',
      'void main(){',
      '  vUv = uv;',
      '  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);',
      '}'
    ].join('\n'),
    fragmentShader: [
      'uniform float uTime; uniform float uDetail; uniform float uReveal;',
      'uniform float uSize;',
      'uniform vec3 uDeep; uniform vec3 uGlow; uniform vec3 uCool;',
      'varying vec2 vUv;',
      'void main(){',
      /* work in world units, not UV — otherwise the falloff is sized to the
         plane rather than to the scene, and the glow floods the frame */
      '  vec2 p = (vUv - 0.5) * uSize;',
      '  float d = length(p);',
      /* ripples spreading out from under the lotus, wavelength in units */
      '  float r = sin(d * 3.4 - uTime * 1.6) * 0.5 + 0.5;',
      '  float extra = (sin(d * 6.1 - uTime * 2.3 + p.x * 0.9) * 0.5 + 0.5) * 0.60',
      '              + (sin((p.x + p.y) * 4.2 + uTime * 1.10) * 0.5 + 0.5) * 0.34;',
      '  r = mix(r, (r + extra) / 1.94, uDetail);',
      '  float pool = exp(-d * 0.44);',              /* hugs the lotus base   */
      '  float far  = smoothstep(23.0, 4.0, d);',    /* far water goes to night */
      '  vec3 c = uDeep;',
      '  c = mix(c, uCool, 0.26 * far);',
      '  c += uGlow * pool * (0.34 + r * 0.30) * 0.60;',
      '  c += uGlow * r * pool * far * 0.10;',       /* glints, only near     */
      '  c *= far;',
      '  gl_FragColor = vec4(c * uReveal, far * uReveal * 0.96);',
      '}'
    ].join('\n')
  });
  water = new THREE.Mesh(geo, mat);
  water.rotation.x = -Math.PI / 2;
  water.position.y = -0.02;
  scene.add(water);
}


/* ───────────────────────────────────────────────────────────────
   4b. TEXTURE WORKSHOP
       Every texture is drawn here at runtime. Nothing is fetched,
       which is what keeps this a single portable file.
   ─────────────────────────────────────────────────────────────── */
function cv2d(w, h) {
  var c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}
function texFrom(canvas) {
  var t = new THREE.CanvasTexture(canvas);
  t.encoding = THREE.sRGBEncoding;
  t.anisotropy = renderer ? Math.min(4, renderer.capabilities.getMaxAnisotropy()) : 1;
  return t;
}

/* A flame: hot ivory core bleeding out through marigold into kumkum. */
var _flameTex = null;
function flameTexture() {
  if (_flameTex) return _flameTex;
  var s = 128, c = cv2d(s, s), x = c.getContext('2d');
  var g = x.createRadialGradient(s / 2, s * 0.60, 1, s / 2, s * 0.60, s * 0.47);
  g.addColorStop(0.00, 'rgba(255,253,242,1)');
  g.addColorStop(0.16, 'rgba(255,229,158,0.94)');
  g.addColorStop(0.40, 'rgba(245,161,27,0.52)');
  g.addColorStop(0.70, 'rgba(208,27,60,0.15)');
  g.addColorStop(1.00, 'rgba(208,27,60,0)');
  x.fillStyle = g; x.fillRect(0, 0, s, s);
  _flameTex = texFrom(c);
  return _flameTex;
}

/* A soft round glow, for the aura and for faking bloom. */
var _glowTex = null;
function glowTexture() {
  if (_glowTex) return _glowTex;
  var s = 256, c = cv2d(s, s), x = c.getContext('2d');
  var g = x.createRadialGradient(s / 2, s / 2, 1, s / 2, s / 2, s / 2);
  g.addColorStop(0.00, 'rgba(255,238,196,0.85)');
  g.addColorStop(0.22, 'rgba(245,161,27,0.40)');
  g.addColorStop(0.55, 'rgba(208,27,60,0.13)');
  g.addColorStop(1.00, 'rgba(208,27,60,0)');
  x.fillStyle = g; x.fillRect(0, 0, s, s);
  _glowTex = texFrom(c);
  return _glowTex;
}


/* ───────────────────────────────────────────────────────────────
   4c. THE LOTUS
       38 petals in four rings, each a parametric sheet that is cupped
       across its width, arced along its length, recurved at the tip
       and twisted a little about its own rib. They hinge at the base,
       so blooming is one rotation per petal.

       The outer ring is the one that makes it read as a lotus rather
       than a tulip: long petals falling almost flat, so the flower
       has a wide plate under the tighter cup at its heart.
   ─────────────────────────────────────────────────────────────── */
var lotus, petals = [], pads = [], lotusGlow = null;

/* The flower, the figure seated in it and his aura are one floating thing,
   so they hang off one group and the water rocks all three together. Bob
   the lotus alone and he comes unstuck from his own seat. */
var raft = null;
function theRaft() {
  if (!raft) { raft = new THREE.Group(); scene.add(raft); }
  return raft;
}

/* Silk, not plastic: veins fanning from the base, shade along both
   edges, and the deep self-shadow where petals overlap at the centre.
   Painted white and multiplied against the vertex gradient, so it only
   ever darkens — the colour still comes from the mesh. */
var _petalTex = null;
function petalTexture() {
  if (_petalTex) return _petalTex;
  var w = 128, h = 320, c = cv2d(w, h), x = c.getContext('2d'), i;
  x.fillStyle = '#FFFFFF'; x.fillRect(0, 0, w, h);

  /* Veins fan from the base — canvas bottom, since the texture is flipped
     on upload — and reach nearly to the tip. */
  x.lineCap = 'round';
  for (i = -8; i <= 8; i++) {
    if (!i) continue;
    var fade = 1 - Math.abs(i) / 11;
    x.strokeStyle = 'rgba(120,32,58,' + (0.20 * fade).toFixed(3) + ')';
    x.lineWidth = 1.5;
    x.beginPath();
    x.moveTo(w / 2, h);
    x.quadraticCurveTo(w / 2 + i * (w / 22), h * 0.42, w / 2 + i * (w / 15), h * 0.04);
    x.stroke();
  }
  x.strokeStyle = 'rgba(120,32,58,.24)';
  x.lineWidth = 3.0;
  x.beginPath(); x.moveTo(w / 2, h); x.lineTo(w / 2, h * 0.02); x.stroke();

  /* Shade along both edges. There is no flat clear band any more — a
     petal with an unmodulated middle reads as chalk, so the falloff runs
     all the way in and only bottoms out on the rib itself. */
  var ge = x.createLinearGradient(0, 0, w, 0);
  ge.addColorStop(0.00, 'rgba(88,22,44,.46)');
  ge.addColorStop(0.18, 'rgba(88,22,44,.20)');
  ge.addColorStop(0.44, 'rgba(88,22,44,.05)');
  ge.addColorStop(0.52, 'rgba(88,22,44,.03)');
  ge.addColorStop(0.62, 'rgba(88,22,44,.07)');
  ge.addColorStop(0.86, 'rgba(88,22,44,.26)');
  ge.addColorStop(1.00, 'rgba(88,22,44,.42)');
  x.fillStyle = ge; x.fillRect(0, 0, w, h);

  /* the deep self-shadow where petals overlap at the heart */
  var gb = x.createLinearGradient(0, h, 0, h * 0.50);
  gb.addColorStop(0, 'rgba(58,10,30,.50)');
  gb.addColorStop(1, 'rgba(58,10,30,0)');
  x.fillStyle = gb; x.fillRect(0, h * 0.48, w, h * 0.52);

  /* Faint irregular mottling. Silk is never evenly dyed, and without it
     the large front petals go glassy under the key. */
  for (i = 0; i < 90; i++) {
    var mx = Math.random() * w, my = Math.random() * h;
    var mr = 5 + Math.random() * 16;
    var gm = x.createRadialGradient(mx, my, 0, mx, my, mr);
    gm.addColorStop(0, 'rgba(104,26,52,.055)');
    gm.addColorStop(1, 'rgba(104,26,52,0)');
    x.fillStyle = gm;
    x.beginPath(); x.arc(mx, my, mr, 0, Math.PI * 2); x.fill();
  }

  _petalTex = texFrom(c);
  return _petalTex;
}

/* A floating leaf, notch and all. Dark enough to sit in the water
   rather than on it, with a rim that catches the diyas. */
var _padTex = null;
function padTexture() {
  if (_padTex) return _padTex;
  var s = 128, c = cv2d(s, s), x = c.getContext('2d'), i;
  var r = s / 2 - 2, gap = 0.30;
  x.translate(s / 2, s / 2);

  x.beginPath();
  x.arc(0, 0, r, gap, Math.PI * 2 - gap);
  x.lineTo(0, 0);
  x.closePath();
  var g = x.createRadialGradient(0, 0, 2, 0, 0, r);
  g.addColorStop(0.00, '#153F33');
  g.addColorStop(0.70, '#0F2E28');
  g.addColorStop(1.00, '#0A1F1C');
  x.fillStyle = g; x.fill();

  x.save();
  x.clip();
  x.strokeStyle = 'rgba(110,170,138,.15)';
  x.lineWidth = 1.5;
  for (i = 0; i < 15; i++) {
    var a = gap + 0.04 + (i / 14) * (Math.PI * 2 - gap * 2 - 0.08);
    x.beginPath(); x.moveTo(0, 0);
    x.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    x.stroke();
  }
  x.restore();

  x.strokeStyle = 'rgba(217,165,33,.13)';
  x.lineWidth = 2.0;
  x.beginPath(); x.arc(0, 0, r - 1.2, gap, Math.PI * 2 - gap); x.stroke();

  _padTex = texFrom(c);
  return _padTex;
}

function petalGeometry(p, seg) {
  /* Across the width matters more than along the length: the cup is a
     parabola, and five spans turn a parabola into a folded V — which is
     what made the petals look like origami rather than flesh. */
  var NU = seg, NV = Math.max(7, Math.round(seg * 0.72));
  var pos = [], uvs = [], cls = [], idx = [];
  var base = col('#FBE6CE'), mid = col('#E4657F'), tip = col('#9E0B36');
  var i, j;
  for (i = 0; i <= NU; i++) {
    var u = i / NU;
    /* A petal has to stay broad almost to its end. Taper it evenly from
       the shoulder and the outer half narrows while its radius grows, so
       neighbours pull apart and the ring turns into a ring of spikes —
       which is the whole starburst problem. The width therefore rides a
       long plateau and only closes in the last few per cent. */
    var sh = Math.sin(Math.PI * Math.pow(u, 0.74));
    var hw = (Math.pow(sh, 0.62) * 0.88 + 0.12)   /* full shoulders, ribbon edge */
           * (1 - Math.pow(u, 13.0))               /* point in the last few %     */
           * p.wide;
    /* the whole cross-section rolls about the rib as it rises */
    var tw = p.twist * u * u, ct = Math.cos(tw), st = Math.sin(tw);
    for (j = 0; j <= NV; j++) {
      var v = (j / NV) * 2 - 1, av = Math.abs(v);
      var px = v * hw;
      var pz = p.arc * u * u              /* the length arcs outward   */
             - p.curl * Math.pow(u, 3.4)  /* and the tip recurves back */
             + p.cup * v * v * 0.62;      /* the edges fall away       */
      pos.push(px * ct - pz * st, u * p.len, px * st + pz * ct);
      uvs.push((v + 1) / 2, u);
      var c = u < 0.18
        ? base.clone().lerp(mid, u / 0.18)
        : mid.clone().lerp(tip, Math.pow((u - 0.18) / 0.82, 1.10));
      /* the rim of a lotus petal is always deeper than its middle */
      c.lerp(tip, Math.pow(av, 2.0) * 0.62);
      cls.push(c.r, c.g, c.b);
    }
  }
  for (i = 0; i < NU; i++) {
    for (j = 0; j < NV; j++) {
      var a = i * (NV + 1) + j, b = a + 1, d = a + NV + 1, e = d + 1;
      idx.push(a, d, b, b, d, e);
    }
  }
  var g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setAttribute('color', new THREE.Float32BufferAttribute(cls, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

/* Rings opening progressively less as they go inward — so the heart still
   cups him while the outer plate lies almost flat.

   Three things stop it reading as a paper rosette. The petals are broad
   enough to overlap their neighbours, so a ring is a surface and not a fan
   of blades. Each one curves down along its length and then flicks back up
   at the tip, which is the S a lotus petal actually makes. And the rings
   are stacked in Y as well as splayed in angle, so they layer against each
   other instead of sharing one plane.

   The angles matter more than anything else. Opened much further than this
   the whole flower flattens into one horizontal spray and, seen from a
   camera near the water, becomes a thin band — a pinwheel rather than a
   throne. The two innermost rings are deliberately long and near-upright:
   that collar rising behind him is what says "seated in a lotus" instead
   of "standing in front of one".

   `phase` offsets a ring by half a step so it interleaves with the one
   outside it. A real lotus is a spiral, not a stack of concentric rings —
   and however broad a petal is, its very tip is narrower than its slot, so
   every ring leaves a notch. The interleaved ring sits just under and
   slightly flatter, filling those notches with pink instead of night. */
var LOTUS_RINGS = [
  { n: 13, len: 1.52, wide: 0.520, cup: 0.26, arc: 0.62, curl: 0.34, twist: 0.22, open: 0.96, y: 0.00, r: 0.345, phase: 0.0 },
  { n: 13, len: 1.32, wide: 0.495, cup: 0.28, arc: 0.56, curl: 0.30, twist: 0.24, open: 1.05, y: 0.010, r: 0.375, phase: 0.5 },
  { n: 11, len: 1.50, wide: 0.470, cup: 0.30, arc: 0.48, curl: 0.26, twist: 0.19, open: 0.90, y: 0.09, r: 0.295, phase: 0.0 },
  { n: 11, len: 1.26, wide: 0.440, cup: 0.32, arc: 0.42, curl: 0.22, twist: 0.21, open: 0.99, y: 0.05, r: 0.320, phase: 0.5 },
  { n:  9, len: 1.22, wide: 0.400, cup: 0.34, arc: 0.34, curl: 0.17, twist: 0.15, open: 0.74, y: 0.19, r: 0.225, phase: 0.0 },
  { n:  7, len: 0.95, wide: 0.330, cup: 0.37, arc: 0.22, curl: 0.10, twist: 0.11, open: 0.55, y: 0.28, r: 0.160, phase: 0.0 }
];

/* Small, dark and well clear of the flower. Pads that crowd it turn the
   shrine into a garden centre. */
var PADS = [
  { a: 0.85, r: 4.30, s: 1.05 },
  { a: 2.10, r: 5.20, s: 0.80 },
  { a: 3.30, r: 4.05, s: 1.20 },
  { a: 4.55, r: 5.05, s: 0.72 },
  { a: 5.60, r: 4.55, s: 0.92 }
];

function buildLotus() {
  lotus = new THREE.Group();
  petals = [];
  pads = [];

  var mat = new THREE.MeshStandardMaterial({
    vertexColors: true,
    map: petalTexture(),
    roughness: 0.68,
    metalness: 0.0,
    side: THREE.DoubleSide,
    emissive: col('#3A0A18'),
    emissiveIntensity: 0.32
  });

  LOTUS_RINGS.forEach(function (ring, ri) {
    var geo = petalGeometry(ring, Q.petalSeg);
    /* Every tier gets every petal. Petal count is the silhouette — drop it
       and the ring opens into gaps and the flower reads as a starburst,
       which is exactly the failure a phone must not see. The saving lives
       in Q.petalSeg instead: sixty-odd petals at fourteen segments is
       around 20k triangles sharing one material, which no phone from the
       last decade will notice. */
    var n = ring.n;
    for (var k = 0; k < n; k++) {
      var az = ((k + ring.phase) / n) * Math.PI * 2 + ri * 0.19;
      var pivot = new THREE.Group();
      pivot.rotation.y = az;

      var m = new THREE.Mesh(geo, mat);
      m.position.set(0, ring.y, ring.r);
      /* Per-petal variation, or the ring closes into a flat plate and
         reads as a paper rosette. The sine term makes the rim undulate
         so light crosses it at changing angles — which is what you
         actually see as form. */
      var jitter = (Math.sin(k * 12.9898 + ri * 78.233) * 0.5);
      var closed = 0.05 + jitter * 0.03;
      var open = ring.open + jitter * 0.17 + Math.sin(az * 2.7 + ri) * 0.075;
      var tilt = jitter * 0.09;
      m.rotation.x = closed;
      m.rotation.z = tilt;
      /* One geometry per ring, so length varies by scale instead. Tips that
         all reach the same radius draw a clean spiked circle; a few per
         cent of slop is what turns it back into a flower. */
      m.scale.setScalar(1 + jitter * 0.13);
      if (Q.shadows) { m.castShadow = true; m.receiveShadow = true; }

      pivot.add(m);
      lotus.add(pivot);
      petals.push({
        mesh: m, closed: closed, open: open, tilt: tilt, ring: ri,
        delay: ri * 0.10 + k * 0.022,
        phase: k * 1.7 + ri * 2.3
      });
    }
  });

  /* receptacle — the seed pod he is actually seated on, so its top has
     to meet BAPPA_BASE_Y rather than sit under a gap. Kept dull: at full
     brightness it out-shouts him, and he is the point. */
  var pod = new THREE.Mesh(
    new THREE.CylinderGeometry(0.42, 0.30, 0.22, tier === TIER.LOW ? 16 : 24),
    new THREE.MeshStandardMaterial({ color: col('#9C8F55'), roughness: 0.92 })
  );
  pod.position.y = 0.40;
  lotus.add(pod);

  /* The seeds and the gold stamen collar were tier-gated, which had it
     backwards: that collar where the petals meet the pod is most of what
     tells the eye "lotus", and it costs one instanced draw call plus seven
     tiny spheres. A phone gets it too. */
  var seedMat = new THREE.MeshStandardMaterial({ color: col('#8E7C3A'), roughness: 0.9 });
  var seedGeo = new THREE.SphereGeometry(0.034, 6, 5);
  for (var s = 0; s < 7; s++) {
    var sa = (s / 7) * Math.PI * 2, sr = 0.11 + (s % 3) * 0.09;
    var sd = new THREE.Mesh(seedGeo, seedMat);
    sd.position.set(Math.cos(sa) * sr, 0.515, Math.sin(sa) * sr);
    lotus.add(sd);
  }

  /* Stamens — the gold collar that rings a real lotus where the petals
     meet the pod. One InstancedMesh, so eighteen of them cost one
     draw call and can be spent freely. */
  var stGeo = new THREE.CylinderGeometry(0.007, 0.016, 0.30, 4);
  stGeo.translate(0, 0.15, 0);                 /* hinge at the base */
  var stMat = new THREE.MeshStandardMaterial({
    color: col('#E8C24A'), roughness: 0.42, metalness: 0.40,
    emissive: col(C.marigold), emissiveIntensity: 0.28
  });
  var ns = 22;
  var inst = new THREE.InstancedMesh(stGeo, stMat, ns);
  var m4 = new THREE.Matrix4(), qLean = new THREE.Quaternion();
  var qAz = new THREE.Quaternion(), up = new THREE.Vector3(0, 1, 0);
  var vp = new THREE.Vector3(), one = new THREE.Vector3(1, 1, 1);
  for (var q = 0; q < ns; q++) {
    var qa = (q / ns) * Math.PI * 2;
    qLean.setFromAxisAngle(new THREE.Vector3(1, 0, 0), 0.46 + (q % 3) * 0.09);
    qAz.setFromAxisAngle(up, qa);
    qLean.premultiply(qAz);
    vp.set(Math.sin(qa) * 0.30, 0.42, Math.cos(qa) * 0.30);
    m4.compose(vp, qLean, one);
    inst.setMatrixAt(q, m4);
  }
  inst.instanceMatrix.needsUpdate = true;
  lotus.add(inst);

  /* the light that lives in the heart of the flower */
  lotusGlow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTexture(), color: col('#FFD98A'),
    transparent: true, opacity: 0,
    blending: THREE.AdditiveBlending, depthWrite: false
  }));
  lotusGlow.scale.set(2.0, 2.0, 1);
  lotusGlow.position.y = 0.44;
  lotus.add(lotusGlow);

  /* The shade the flower casts on the water. A flat disc gives it a
     hard rim that reads as a plate the lotus is standing on, so this
     is a gradient that has no edge at all. */
  var shadeTex = (function () {
    var s = 128, c = cv2d(s, s), x = c.getContext('2d');
    var g = x.createRadialGradient(s / 2, s / 2, 1, s / 2, s / 2, s / 2);
    g.addColorStop(0.00, 'rgba(30,6,22,.72)');
    g.addColorStop(0.42, 'rgba(30,6,22,.46)');
    g.addColorStop(0.78, 'rgba(30,6,22,.13)');
    g.addColorStop(1.00, 'rgba(30,6,22,0)');
    x.fillStyle = g; x.fillRect(0, 0, s, s);
    return texFrom(c);
  })();
  var skirt = new THREE.Mesh(
    new THREE.PlaneGeometry(5.6, 5.6),
    new THREE.MeshBasicMaterial({
      map: shadeTex, transparent: true, depthWrite: false
    })
  );
  skirt.rotation.x = -Math.PI / 2;
  skirt.position.y = 0.008;
  lotus.add(skirt);

  theRaft().add(lotus);

  /* Leaves, floating clear of the flower. A lotus alone on open water
     reads as an ornament; with pads around it, it reads as a pond. */
  var padGeo = new THREE.PlaneGeometry(1, 1);
  var padTex = padTexture();
  PADS.forEach(function (p, i) {
    var mesh = new THREE.Mesh(padGeo, new THREE.MeshStandardMaterial({
      map: padTex, transparent: true, roughness: 0.86, metalness: 0.0,
      side: THREE.DoubleSide, depthWrite: false
    }));
    mesh.scale.setScalar(p.s * 1.15);
    mesh.rotation.x = -Math.PI / 2;
    mesh.rotation.z = p.a * 1.7;
    mesh.position.set(Math.cos(p.a) * p.r, 0.03, Math.sin(p.a) * p.r);
    scene.add(mesh);
    pads.push({ mesh: mesh, y: 0.03, spin: p.a * 1.7, phase: i * 2.1 });
  });
}



/* ───────────────────────────────────────────────────────────────
   4d. BAPPA — hand-drawn, in five flat layers
       No 3D model of the deity. Each layer is SVG folk art on its
       own plane, and because the planes really are separated in
       depth, the parallax is genuine perspective rather than a
       simulated effect. The group only *partly* turns to face the
       camera, and that withheld rotation is what you read as depth.
   ─────────────────────────────────────────────────────────────── */
var bappa, bappaLayers = [], bappaReady = 0, bappaFade = 0;

/* Kutch folk palette — flat saturated fills, thick ivory outlines. */
var A = {

function svgDoc(inner) {

/* Rings of mirror-work (આભલા) — the Kutch signature. */
function abhla(cx, cy, r, n, spread) {
  var out = '';
  for (var i = 0; i < n; i++) {
    var a = (i / n) * Math.PI * 2;
    var x = (cx + Math.cos(a) * spread).toFixed(1);
    var y = (cy + Math.sin(a) * spread * 0.55).toFixed(1);
    out += '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + A.iv + '"/>';
  }
  return out;
}

var BAPPA_ART = {

  face: svgDoc([

    '<path d="M 144 250 q -14 30 6 48" fill="none" stroke="' + A.iv + '" stroke-width="17" stroke-linecap="round"/>',

    '<path d="M 154 170 q 21 17 42 1" fill="none" stroke="' + A.dk + '" stroke-width="7" stroke-linecap="round"/>',
