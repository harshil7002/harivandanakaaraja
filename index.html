  /* ── the mukut, frontmost ── */
  crown: svgDoc([
    '<path d="M 130 124 L 200 14 L 270 124 Z" fill="' + A.iv + '"/>',
    '<path d="M 140 117 L 200 30 L 260 117 Z" fill="' + A.go + '"/>',
    '<path d="M 168 112 L 200 56 L 232 112 Z" fill="' + A.ku + '"/>',
    '<rect x="122" y="110" width="156" height="28" rx="12" fill="' + A.iv + '"/>',
    '<rect x="128" y="115" width="144" height="18" rx="8" fill="' + A.go + '"/>',
    '<circle cx="152" cy="124" r="5.5" fill="' + A.ku + '"/>',
    '<circle cx="176" cy="124" r="5.5" fill="' + A.iv + '"/>',
    '<circle cx="200" cy="124" r="5.5" fill="' + A.ku + '"/>',
    '<circle cx="224" cy="124" r="5.5" fill="' + A.iv + '"/>',
    '<circle cx="248" cy="124" r="5.5" fill="' + A.ku + '"/>',
    '<circle cx="200" cy="14" r="13" fill="' + A.iv + '"/>',
    '<circle cx="200" cy="14" r="8" fill="' + A.ma + '"/>'
  ].join(''))
};

/* Depth order, back to front. The spread is what you see as dimension. */
var BAPPA_STACK = [
  { key: 'body',  z: -0.30 },
  { key: 'earL',  z: -0.13 },
  { key: 'earR',  z: -0.13 },
  { key: 'face',  z:  0.00 },
  { key: 'crown', z:  0.18 }
];

var BAPPA_W = 1.94, BAPPA_H = 2.33, BAPPA_BASE_Y = 0.47;
/* his head sits at 180/480 down the artwork — everything that has to
   register with him (aura, halo, later the toran) derives from this */
var HEAD_Y = BAPPA_BASE_Y + BAPPA_H * 0.625;

function bappaPlane(svg, z, order, w, h) {
  var res = tier === TIER.LOW ? 1 : 2;
  var canvas = cv2d(400 * res, 480 * res);
  var tex = texFrom(canvas);
  var mesh = new THREE.Mesh(
    new THREE.PlaneGeometry(w, h),
    new THREE.MeshBasicMaterial({
      map: tex, transparent: true, opacity: 0,
      depthWrite: false, side: THREE.DoubleSide
    })
  );
  mesh.position.z = z;
  mesh.renderOrder = 10 + order;

  var img = new Image();
  img.onload = function () {
    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
    tex.needsUpdate = true;
    bappaReady++;
  };
  img.onerror = function () { bappaReady++; };
  /* a data URI is same-origin, so this neither taints the canvas nor
     needs a server — it works from file:// */
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);

  return { mesh: mesh, z: z };
}

function buildBappa() {
  bappa = new THREE.Group();
  bappaLayers = [];

  if (BAPPA_IMAGE) {
    /* your own cutout, as one billboard */
    var tex = new THREE.TextureLoader().load(BAPPA_IMAGE);
    tex.encoding = THREE.sRGBEncoding;
    var m = new THREE.Mesh(
      new THREE.PlaneGeometry(BAPPA_W, BAPPA_H),
      new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: 0, depthWrite: false })
    );
    m.renderOrder = 12;
    bappaLayers.push({ mesh: m, z: 0 });
    bappa.add(m);
    bappaReady = 1;
  } else {
    BAPPA_STACK.forEach(function (L, i) {
      var layer = bappaPlane(BAPPA_ART[L.key], L.z, i, BAPPA_W, BAPPA_H);
      bappaLayers.push(layer);
      bappa.add(layer.mesh);
    });
  }

  bappa.position.y = BAPPA_BASE_Y + BAPPA_H / 2;
  theRaft().add(bappa);
}

function updateBappa(dt) {
  if (!bappa) return;
  var want = bappaReady >= bappaLayers.length ? bappaFade : 0;
  bappaLayers.forEach(function (L) {
    L.mesh.material.opacity = want;
  });
  /* Turn most of the way toward the camera, but hold some back —
     the withheld rotation is the parallax between layers. */
  var az = Math.atan2(camera.position.x, camera.position.z);
  bappa.rotation.y = az * 0.62;
  if (!reduceMotion) {
    bappa.position.y = BAPPA_BASE_Y + BAPPA_H / 2
      + Math.sin(t0 * 0.5) * 0.022 - 0.62 * (1 - bappaFade);
  } else {
    bappa.position.y = BAPPA_BASE_Y + BAPPA_H / 2;
  }
}


/* ───────────────────────────────────────────────────────────────
   4e. AURA — the prabhavali behind him
   ─────────────────────────────────────────────────────────────── */
var aura = {};

function buildAura() {
  aura.group = new THREE.Group();

  aura.halo = new THREE.Mesh(
    new THREE.TorusGeometry(0.98, 0.022, 6, tier === TIER.LOW ? 26 : 64),
    new THREE.MeshBasicMaterial({
      color: col(C.marigold), transparent: true, opacity: 0,
      blending: THREE.AdditiveBlending, depthWrite: false
    })
  );
  aura.halo.position.y = HEAD_Y;
  aura.halo.position.z = -0.36;
  aura.group.add(aura.halo);

  aura.glow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTexture(), color: col(C.marigold), transparent: true, opacity: 0,
    blending: THREE.AdditiveBlending, depthWrite: false
  }));
  aura.glow.scale.set(4.6, 4.6, 1);
  aura.glow.position.set(0, HEAD_Y - 0.2, -0.5);
  aura.group.add(aura.glow);

  /* a ring of small flames — the prabhavali proper */
  aura.rays = [];
  if (tier > TIER.LOW) {
    for (var i = 0; i < 14; i++) {
      var a = (i / 14) * Math.PI * 2;
      var s = new THREE.Sprite(new THREE.SpriteMaterial({
        map: flameTexture(), color: col('#FFD98A'), transparent: true, opacity: 0,
        blending: THREE.AdditiveBlending, depthWrite: false
      }));
      s.scale.set(0.30, 0.44, 1);
      s.position.set(Math.cos(a) * 1.16, HEAD_Y + Math.sin(a) * 1.16, -0.42);
      aura.group.add(s);
      aura.rays.push({ sprite: s, phase: i * 0.9 });
    }
  }
  theRaft().add(aura.group);
}

function updateAura() {
  if (!aura.group) return;
  var breath = reduceMotion ? 1 : 0.82 + Math.sin(t0 * 1.15) * 0.18;
  breath *= 1 + aartiT * 0.55;
  aura.halo.material.opacity = Math.min(1, 0.85 * bappaFade * breath);
  /* the prabhavali turns faster while the aarti burns */
  aura.halo.rotation.z = reduceMotion ? 0 : t0 * 0.10 + aartiT * 0.9;
  aura.glow.material.opacity = Math.min(1, 0.40 * bappaFade * breath);
  aura.rays.forEach(function (r) {
    var f = reduceMotion ? 0.7 : 0.45 + Math.sin(t0 * 2.6 + r.phase) * 0.30;
    r.sprite.material.opacity = Math.min(1, f * bappaFade * (1 + aartiT * 0.85));
  });
}


/* ───────────────────────────────────────────────────────────────
   4f. DIYAS — six on the water, only a few casting real light
   ─────────────────────────────────────────────────────────────── */
var diyas = [];

function buildDiyas() {
  var N = 6, R = 3.55;
  var brass = new THREE.MeshStandardMaterial({
    color: col('#8A6A22'), roughness: 0.40, metalness: 0.80,
    emissive: col('#301F07'), emissiveIntensity: 1
  });
  var bowlGeo = new THREE.CylinderGeometry(0.19, 0.10, 0.12, tier === TIER.LOW ? 8 : 16);
  var footGeo = new THREE.CylinderGeometry(0.055, 0.085, 0.04, tier === TIER.LOW ? 8 : 12);

  for (var i = 0; i < N; i++) {
    var a = (i / N) * Math.PI * 2 + 0.5;
    var g = new THREE.Group();
    g.position.set(Math.cos(a) * R, 0.055, Math.sin(a) * R);

    var bowl = new THREE.Mesh(bowlGeo, brass);
    var foot = new THREE.Mesh(footGeo, brass);
    foot.position.y = -0.075;
    g.add(bowl, foot);

    var flame = new THREE.Sprite(new THREE.SpriteMaterial({
      map: flameTexture(), transparent: true, opacity: 0,
      blending: THREE.AdditiveBlending, depthWrite: false
    }));
    flame.scale.set(0.26, 0.40, 1);
    flame.position.y = 0.20;
    g.add(flame);

    var pool = new THREE.Sprite(new THREE.SpriteMaterial({
      map: glowTexture(), color: col(C.marigold), transparent: true, opacity: 0,
      blending: THREE.AdditiveBlending, depthWrite: false
    }));
    pool.scale.set(1.5, 1.5, 1);
    pool.position.y = 0.16;
    g.add(pool);

    var light = null;
    if (i < Q.realLights) {
      light = new THREE.PointLight(col('#FFB347'), 0, 7.5, 2);
      light.position.y = 0.30;
      g.add(light);
    }

    scene.add(g);
    diyas.push({
      group: g, flame: flame, pool: pool, light: light,
      phase: i * 2.1, lit: 0, order: i
    });
  }
}

function updateDiyas() {
  /* during the aarti every wick stands up and the three real lights
     roughly double — the flare is all in gain, never in new objects */
  var flare = 1 + aartiT * 1.05;
  diyas.forEach(function (d) {
    /* two detuned sines read as a wick guttering; no noise texture needed */
    var f = reduceMotion ? 1
      : 0.80 + Math.sin(t0 * 7.3 + d.phase) * 0.13 + Math.sin(t0 * 17.1 + d.phase * 2.7) * 0.07;
    d.flame.material.opacity = Math.min(1, 0.95 * d.lit * f * flare);
    d.flame.scale.set(0.26 * (0.92 + f * 0.10) * (1 + aartiT * 0.34),
                      0.40 * (0.88 + f * 0.16) * (1 + aartiT * 0.62), 1);
    d.pool.material.opacity = Math.min(1, 0.30 * d.lit * f * flare);
    if (d.light) d.light.intensity = 2.5 * d.lit * f * (1 + aartiT * 1.5);
  });
}


/* ───────────────────────────────────────────────────────────────
   4g. THE INTRO
       One orchestrated reveal, then the scene answers touch. This
       is the only motion the visitor does not ask for.
   ─────────────────────────────────────────────────────────────── */
var intro = { t: 0, running: true };

function seg(t, a, b) { return Math.max(0, Math.min(1, (t - a) / (b - a))); }
function easeOut(x) { return 1 - Math.pow(1 - x, 3); }
function backOut(x) {
  var c = 1.42;
  return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2);
}

function updateIntro(dt) {
  if (reduceMotion) {
    /* collapsed: everything simply is, after a beat */
    intro.t += dt;
    var on = intro.t > 0.25 ? 1 : 0;
    diyas.forEach(function (d) { d.lit = on; });
    petals.forEach(function (p) { p.mesh.rotation.x = p.open; });
    bappaFade = on;
    if (water) water.material.uniforms.uReveal.value = on;
    if (intro.t > 0.4) intro.running = false;
    return;
  }

  intro.t += dt;
  var T = intro.t;

  /* 0.0–0.8  the first diya takes light */
  diyas.forEach(function (d) {
    var at = d.order === 0 ? 0.15 : 4.25 + d.order * 0.16;
    d.lit = easeOut(seg(T, at, at + 0.85));
  });

  /* 0.8–1.8  its light finds the water, and the bud on it */
  if (water) {
    water.material.uniforms.uReveal.value = easeOut(seg(T, 0.75, 2.0));
  }

  /* 1.8–3.4  the petals unfurl, outer ring first */
  petals.forEach(function (p) {
    var s = backOut(seg(T, 1.75 + p.delay, 1.75 + p.delay + 1.05));
    var sway = Math.sin(t0 * 0.55 + p.phase) * 0.013;
    p.mesh.rotation.x = p.closed + (p.open - p.closed) * s + sway * s;
  });

  /* 3.0–4.3  he rises from inside the flower */
  bappaFade = easeOut(seg(T, 3.0, 4.30));

  /* 4.2  the nameplate resolves */
  if (T > 4.15 && !intro.named) {
    intro.named = true;
    document.getElementById('nameplate').classList.add('lit');
  }

  if (T > 5.6) intro.running = false;
}

/* The flower is never still. Three motions at different speeds, none of
   them in step with the others: petals breathe on a wave that travels
   outward ring by ring, each petal rocks a little on its own rib, and
   the whole flower turns once in about five minutes — slow enough that
   you notice it only by looking away and back. */
function updateLotus() {
  if (!lotus) return;

  if (!intro.running && !reduceMotion) {
    for (var i = 0; i < petals.length; i++) {
      var p = petals[i];
      /* the breath, travelling outward ring by ring */
      var w = Math.sin(t0 * 0.55 - p.ring * 0.72 + p.phase * 0.11);
      /* and a second, faster wave running round the ring the other way,
         so no two petals are ever at the same angle at the same moment */
      var w2 = Math.sin(t0 * 0.94 + p.phase * 0.83);
      p.mesh.rotation.x = p.open + w * 0.085 + w2 * 0.026;
      p.mesh.rotation.z = p.tilt + Math.sin(t0 * 0.43 + p.phase) * 0.045;
      p.mesh.rotation.y = Math.sin(t0 * 0.31 + p.phase * 0.6) * 0.030;
    }
    /* fast enough to notice while you watch, slow enough that it never
       becomes the thing you are looking at: about two minutes a turn */
    lotus.rotation.y = t0 * 0.052;
  }

  /* Water rocks the whole raft — flower, figure and aura as one. Long
     period and tiny amplitude, so it reads as buoyancy and not as a boat
     in weather. */
  if (raft && !reduceMotion) {
    raft.position.y = Math.sin(t0 * 0.37) * 0.021;
    raft.rotation.z = Math.sin(t0 * 0.29 + 1.1) * 0.0075;
    raft.rotation.x = Math.sin(t0 * 0.24 + 2.7) * 0.0060;
  }

  if (lotusGlow) {
    /* it kindles as the flower opens, then pulses with the same breath */
    var lit = intro.running ? easeOut(seg(intro.t, 2.40, 4.10)) : 1;
    var b = reduceMotion ? 0.19 : 0.19 + Math.sin(t0 * 0.55) * 0.070;
    lotusGlow.material.opacity = Math.min(1, lit * b * (1 + aartiT * 2.2));
  }

  if (!reduceMotion) {
    for (var q = 0; q < pads.length; q++) {
      var pd = pads[q];
      pd.mesh.position.y = pd.y + Math.sin(t0 * 0.42 + pd.phase) * 0.024;
      pd.mesh.rotation.z = pd.spin + Math.sin(t0 * 0.13 + pd.phase) * 0.11;
      /* pads tip on the swell as well, or they read as decals */
      pd.mesh.rotation.y = Math.sin(t0 * 0.33 + pd.phase * 1.4) * 0.055;
    }
  }
}


/* ───────────────────────────────────────────────────────────────
   5. CAMERA RIG
      A scripted cinematic camera, not free orbit. Stations are
      authored viewpoints; drag adds a decaying offset so you can
      lean around the scene without ever getting lost in it.
      (OrbitControls is ESM-only in 0.149 and unreachable from a
      classic script — but free orbit would be wrong here anyway.)
   ─────────────────────────────────────────────────────────────── */
/* `tx` shifts the whole orbit centre sideways. With a panel open in
   landscape that slides the lotus left of the sheet, so Bappa stays in
   view instead of being covered by his own website. */
var STATION = {
  home:  { r: 7.8, az: 0,     el: 0.30, ty: 1.58, tx: 0,   fov: 42 },
  wide:  { r: 9.9, az: 0,     el: 0.38, ty: 1.42, tx: 0,   fov: 46 },
  panel: { r: 8.6, az: -0.34, el: 0.27, ty: 1.62, tx: 2.1, fov: 40 }
};

var rig = {
  r: 15, az: 0, el: 0.62, ty: 0.7, tx: 0, fov: 52,          /* current  */
  tr: 15, taz: 0, tel: 0.62, tty: 0.7, ttx: 0, tfov: 52,    /* target   */
  azOff: 0, elOff: 0,                                        /* drag lean */
  ease: 0.055
};

function goto(station, snap) {
  var s = STATION[station] || STATION.home;
  rig.tr = s.r; rig.taz = s.az; rig.tel = s.el;
  rig.tty = s.ty; rig.ttx = s.tx || 0; rig.tfov = s.fov;
  if (snap || reduceMotion) {
    rig.r = rig.tr; rig.az = rig.taz; rig.el = rig.tel;
    rig.ty = rig.tty; rig.tx = rig.ttx; rig.fov = rig.tfov;
  }
}

function updateCamera(dt) {
  var k = reduceMotion ? 1 : 1 - Math.pow(1 - rig.ease, dt * 60);
  rig.r   += (rig.tr   - rig.r)   * k;
  rig.az  += (rig.taz  - rig.az)  * k;
  rig.el  += (rig.tel  - rig.el)  * k;
  rig.ty  += (rig.tty  - rig.ty)  * k;
  rig.tx  += (rig.ttx  - rig.tx)  * k;
  rig.fov += (rig.tfov - rig.fov) * k;

  /* the lean decays back to the authored framing */
  if (!drag.active) {
    rig.azOff *= Math.pow(0.90, dt * 60);
    rig.elOff *= Math.pow(0.90, dt * 60);
  }

  /* a slow breath, so the scene is never dead still */
  var breathe = reduceMotion ? 0 : Math.sin(t0 * 0.22) * 0.016;

  var az = rig.az + rig.azOff + breathe;
  var el = Math.max(-0.12, Math.min(1.05, rig.el + rig.elOff));
  var cr = Math.cos(el) * rig.r;

  camera.position.set(
    rig.tx + Math.sin(az) * cr,
    Math.sin(el) * rig.r + rig.ty,
    Math.cos(az) * cr
  );
  camera.lookAt(rig.tx, rig.ty, 0);

  if (Math.abs(camera.fov - rig.fov) > 0.01) {
    camera.fov = rig.fov;
    camera.updateProjectionMatrix();
  }
}

/* ── Pointer: one gesture model for mouse, pen and touch ── */
var drag = { active: false, id: null, x: 0, y: 0, ox: 0, oy: 0, moved: 0 };

function onDown(e) {
  if (drag.active) return;
  drag.active = true; drag.id = e.pointerId;
  drag.x = drag.ox = e.clientX;
  drag.y = drag.oy = e.clientY;
  drag.moved = 0;
}
function onMove(e) {
  if (!drag.active || e.pointerId !== drag.id) return;
  var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.x = e.clientX; drag.y = e.clientY;
  drag.moved += Math.abs(dx) + Math.abs(dy);
  if (reduceMotion) return;
  rig.azOff = Math.max(-0.55, Math.min(0.55, rig.azOff - dx * 0.0042));
  rig.elOff = Math.max(-0.22, Math.min(0.34, rig.elOff + dy * 0.0026));
}
function onUp(e) {
  if (!drag.active || e.pointerId !== drag.id) return;
  drag.active = false; drag.id = null;
}

/* Hovering with a mouse gives the same lean, at a whisper. */
function onHover(e) {
  if (isTouch) return;
  if (drag.active || reduceMotion) return;
  var nx = (e.clientX / window.innerWidth) * 2 - 1;
  var ny = (e.clientY / window.innerHeight) * 2 - 1;
  rig.azOff += (-nx * 0.16 - rig.azOff) * 0.05;
  rig.elOff += ( ny * 0.07 - rig.elOff) * 0.05;
}


/* ───────────────────────────────────────────────────────────────
   5b. NAVIGATION
       Four real buttons, low in the frame. They are DOM, not scene
       objects: a gold glyph over a pool of shade, no container and no
       bar behind them, so they read as things lying in the pandal
       rather than as a strip of chrome bolted across it.

       Being real buttons, they are also the keyboard and screen-reader
       route — there is no hidden twin nav to fall out of step with.
   ─────────────────────────────────────────────────────────────── */
var SECTIONS = [
  { id: 'gallery', gu: 'ગેલેરી', en: 'Gallery',
    sub: 'મંડળની ક્ષણો — આગમનથી વિસર્જન સુધી.' },
  { id: 'quiz', gu: 'પ્રશ્નોત્તરી', en: 'Quiz',
    sub: 'બાપ્પા વિશે દસ પ્રશ્નો. ખોટો જવાબ પણ કંઈક શીખવે છે.' },
  { id: 'wishes', gu: 'શુભકામનાઓ', en: 'Blessings',
    sub: 'ઘંટ વગાડો ને આશીર્વાદ મેળવો — અથવા કોઈને શુભકામના મોકલો.' },
  { id: 'names', gu: '૧૦૮ નામ', en: '108 Names',
    sub: 'ગણપતિ અષ્ટોત્તરશતનામાવલી — એક મણકો, એક નામ.' }
];

/* Stage 4 registers a builder here per section id. */
var VIEWS = {};

var active = null;                       /* open section id, or null */

/* ── The glyphs. Each one is the section's own object — the frame you
      hang photographs in, the modak on its dish, the bell you ring for a
      blessing, the mala you count names on. Line-art in varakh gold, so
      they belong to the same hand that drew the title. ── */
var ICONS = {

  /* a framed picture hanging from a garland swag */
  gallery:
    '<path class="ico-l" d="M2.6 3.8c4.6 3.7 9 5.5 13.4 5.5s8.8-1.8 13.4-5.5"/>' +
    '<path class="ico-l" d="M16 9.3v1.5"/>' +
    '<rect class="ico-f" x="6.2" y="10.8" width="19.6" height="16.4" rx="1.4"/>' +
    '<rect class="ico-l" x="6.2" y="10.8" width="19.6" height="16.4" rx="1.4"/>' +
    '<circle class="ico-l" cx="11.9" cy="16.2" r="1.85"/>' +
    '<path class="ico-l" d="M7.6 25.2l4.7-5 3.1 3.3 3.7-4.7 5.3 6.4"/>',

  /* a modak on a dish, pleats and all */
  quiz:
    '<path class="ico-f" d="M16 3.4c1.2 2.3 1.5 3.8 1.3 4.9 4.8 2.2 8.1 8.2 8.6 14.7H6.1C6.6 16.5 9.9 10.5 14.7 8.3c-.2-1.1.1-2.6 1.3-4.9z"/>' +
    '<path class="ico-l" d="M16 3.4c1.2 2.3 1.5 3.8 1.3 4.9 4.8 2.2 8.1 8.2 8.6 14.7H6.1C6.6 16.5 9.9 10.5 14.7 8.3c-.2-1.1.1-2.6 1.3-4.9z"/>' +
    '<path class="ico-l" d="M16 8.7v14.3M11.5 11.4l-1.1 11.6M20.5 11.4l1.1 11.6"/>' +
    '<path class="ico-l" d="M3.4 23h25.2c-1 3.4-4 5.4-8 5.4h-9.2c-4 0-7-2-8-5.4z"/>',

  /* a brass bell, mid-ring */
  wishes:
    '<circle class="ico-l" cx="16" cy="4.6" r="2"/>' +
    '<path class="ico-f" d="M16 7c5.2 0 8.6 5.8 9.3 13.2.1 1.1-.7 2-1.8 2H8.5c-1.1 0-1.9-.9-1.8-2C7.4 12.8 10.8 7 16 7z"/>' +
    '<path class="ico-l" d="M16 7c5.2 0 8.6 5.8 9.3 13.2.1 1.1-.7 2-1.8 2H8.5c-1.1 0-1.9-.9-1.8-2C7.4 12.8 10.8 7 16 7z"/>' +
    '<path class="ico-l" d="M16 22.4v2.4"/>' +
    '<circle class="ico-l" cx="16" cy="26.5" r="1.6"/>' +
    '<path class="ico-l" d="M2.9 12.9c-1.1 2.4-1.1 4.9 0 7.3M29.1 12.9c1.1 2.4 1.1 4.9 0 7.3" opacity=".5"/>',

  /* a strung mala — beads generated, so the ring stays even */
  names: (function () {
    var cx = 16, cy = 16.4, R = 9.1, n = 16, s = '', i, a;
    s += '<circle class="ico-l" cx="' + cx + '" cy="' + cy + '" r="' + R + '" opacity=".34"/>';
    for (i = 0; i < n; i++) {
      /* offset by half a step so no bead sits where the guru bead goes */
      a = Math.PI / 2 + ((i + 0.5) / n) * Math.PI * 2;
      s += '<circle class="ico-b" cx="' + (cx + Math.cos(a) * R).toFixed(2) +
           '" cy="' + (cy + Math.sin(a) * R).toFixed(2) + '" r="1.5"/>';
    }

    s += '<circle class="ico-f" cx="' + cx + '" cy="' + (cy + R) + '" r="2.7"/>';
    s += '<circle class="ico-l" cx="' + cx + '" cy="' + (cy + R) + '" r="2.7"/>';

};

var dockEl = null, dockLit = false;

function buildDock() {
  dockEl = document.getElementById('dock');

  SECTIONS.forEach(function (s) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'dbtn';

    var svg = '<svg viewBox="0 0 32 32" aria-hidden="true" focusable="false">' +
              ICONS[s.id] + '</svg>';
    b.innerHTML = svg;

    b.appendChild(document.createTextNode(s.gu));
    var sm = document.createElement('small');
    sm.lang = 'en';
    sm.textContent = s.en;
    b.appendChild(sm);

    b.addEventListener('click', function () { openSection(s.id, b); });
    dockEl.appendChild(b);
  });
}

/* They arrive at the end of the reveal and stand aside for a panel.
   One class toggle rather than a per-frame value — CSS carries the fade. */
function setDock(on) {
  if (on === dockLit || !dockEl) return;
  dockLit = on;
  dockEl.classList.toggle('lit', on);
}
function updateDock() {
  setDock(!active && (!intro.running || intro.t >= 4.35));
}


/* ── Panels ── */
var lastTrigger = null;
var panelEl, sheetEl;

function sectionById(id) {
  for (var i = 0; i < SECTIONS.length; i++) if (SECTIONS[i].id === id) return SECTIONS[i];
  return null;
}

/* Landscape slides the lotus clear of the sheet; portrait can only pull
   back, since the sheet covers the lower two thirds. */
function framePanel() {
  if (window.innerWidth >= window.innerHeight) {
    goto('panel');
  } else {
    rig.tr = 9.4; rig.taz = 0; rig.tel = 0.24;
    rig.tty = 1.55; rig.ttx = 0; rig.tfov = STATION.home.fov + 4;
    if (reduceMotion) {
      rig.r = rig.tr; rig.az = rig.taz; rig.el = rig.tel;
      rig.ty = rig.tty; rig.tx = rig.ttx; rig.fov = rig.tfov;
    }
  }
}

/* ───────────────────────────────────────────────────────────────
   6b. ૧૦૮ નામ — the mala
       Recitation state lives out here so closing the panel and
       coming back does not lose your place. It is a count, not a
       score: nothing is persisted past the visit.
   ─────────────────────────────────────────────────────────────── */
var mala = { i: 0, far: 0, list: false, done: false };

var GU_DIGITS = '૦૧૨૩૪૫૬૭૮૯';
function gu(n) {
  var s = String(n), out = '', i;
  for (i = 0; i < s.length; i++) out += GU_DIGITS.charAt(+s.charAt(i));
  return out;
}

function nameAt(i) { return NAMES[i].split('|'); }

function viewNames(root) {
  var beads = [], faceEl, countEl, prevEl, nextEl, threadEl, doneEl;

  function el(tag, cls, txt) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt != null) e.textContent = txt;
    return e;
  }

  /* ── the header: how far along, and the way out to the list ── */
  var head = el('div', 'mala-head');
  countEl = el('span', 'mala-count');
  /* polite, not assertive: this updates on every tap and must never
     interrupt the name itself being read out */
  countEl.setAttribute('aria-live', 'polite');
  countEl.setAttribute('aria-atomic', 'true');
  head.appendChild(countEl);

  var toggle = el('button', 'quiet', 'યાદી જુઓ');
  toggle.type = 'button';
  toggle.addEventListener('click', function () {
    mala.list = !mala.list;
    render();
  });
  head.appendChild(toggle);
  root.appendChild(head);

  /* ── the thread ── */
  threadEl = el('div', 'thread');
  /* the beads duplicate what the counter already announces, and 108
     extra stops would bury the keyboard. Pointer gets random access;
     the keyboard gets the counter and the two buttons. */
  threadEl.setAttribute('aria-hidden', 'true');
  for (var b = 0; b < NAMES.length; b++) {
    var bead = el('span', 'bead');
    if ((b + 1) % 27 === 0) bead.className += ' mark';
    if (b === NAMES.length - 1) bead.className += ' guru';
    bead.setAttribute('data-i', b);
    beads.push(bead);
    threadEl.appendChild(bead);
  }
  threadEl.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('.bead') : null;
    if (!t) return;
    go(+t.getAttribute('data-i'), true);
  });
  root.appendChild(threadEl);

  /* ── the name ── */
  faceEl = el('button', 'face');
  faceEl.type = 'button';
  faceEl.setAttribute('aria-live', 'polite');
  faceEl.appendChild(el('span', 'om', 'ૐ'));
  faceEl.appendChild(el('span', 'nm'));
  var rm = el('span', 'rm');
  rm.lang = 'sa';
  faceEl.appendChild(rm);
  faceEl.appendChild(el('span', 'mn'));
  faceEl.addEventListener('click', function () { go(mala.i + 1); });
  root.appendChild(faceEl);

  /* ── the two controls ── */
  var nav = el('div', 'mala-nav');
  prevEl = el('button', 'quiet', 'પાછળ');
  prevEl.type = 'button';
  prevEl.addEventListener('click', function () { go(mala.i - 1); });
  nextEl = el('button', 'turn-next', 'આગળ');
  nextEl.type = 'button';
  nextEl.addEventListener('click', function () { go(mala.i + 1); });
  nav.appendChild(prevEl);
  nav.appendChild(nextEl);
  root.appendChild(nav);

  doneEl = el('div', 'aarti-done');
  doneEl.hidden = true;
  doneEl.appendChild(el('b', null, 'આરતી'));
  doneEl.appendChild(el('span', null,
    'એકસો આઠ નામ પૂરાં થયાં. બાપ્પાના આશીર્વાદ સદા તમારી સાથે રહે.'));
  root.appendChild(doneEl);

  var note = el('p', 'src-note',
    'આ ગણપતિ અષ્ટોત્તરશતનામાવલીની એક પ્રચલિત આવૃત્તિ છે. ' +
    'પરંપરા પ્રમાણે નામોનો ક્રમ થોડો જુદો પણ હોઈ શકે.');
  root.appendChild(note);

  var listEl = el('ol', 'mala-list');
  listEl.hidden = true;
  root.appendChild(listEl);
  var listBuilt = false;

  function buildList() {
    if (listBuilt) return;
    listBuilt = true;
    var frag = document.createDocumentFragment();
    for (var i = 0; i < NAMES.length; i++) {
      var p = nameAt(i);
      var li = el('li');
      li.setAttribute('data-i', i);
      li.appendChild(el('span', 'n', gu(i + 1)));
      var g = el('span', 'g', p[0]);
      var e = el('em', null, p[1]);
      e.lang = 'sa';
      g.appendChild(e);
      li.appendChild(g);
      li.appendChild(el('span', 'm', p[2]));
      frag.appendChild(li);
    }
    listEl.appendChild(frag);
    listEl.addEventListener('click', function (ev) {
      var t = ev.target.closest ? ev.target.closest('li') : null;
      if (!t) return;
      mala.list = false;
      go(+t.getAttribute('data-i'), true);
      render();
    });
    /* the list is built the first time it is asked for, which is after
       paint() has already run — so it has to be caught up by hand or it
       opens with nothing marked however far you had counted */
    markTold();
  }

  function markTold() {
    var items = listEl.children;
    for (var j = 0; j < items.length; j++) {
      items[j].className = j <= mala.far ? 'told' : '';
    }
  }

  function go(i, jump) {
    if (i < 0 || i >= NAMES.length) return;
    mala.i = i;
    if (i > mala.far) mala.far = i;
    /* the finale fires once, on first arrival at the last bead */
    if (i === NAMES.length - 1 && !mala.done) {
      mala.done = true;
      if (typeof fireAarti === 'function') fireAarti();
    }
    paint(!jump);
  }

  /* centring by hand rather than scrollIntoView, which on a nested
     scroller will happily scroll the sheet as well */
  function centreBead(smooth) {
    var t = beads[mala.i];
    if (!t || !threadEl.clientWidth) return;
    var x = t.offsetLeft - threadEl.clientWidth / 2 + t.offsetWidth / 2;
    x = Math.max(0, Math.min(x, threadEl.scrollWidth - threadEl.clientWidth));
    if (smooth && !reduceMotion && threadEl.scrollTo) {
      threadEl.scrollTo({ left: x, behavior: 'smooth' });
    } else {
      threadEl.scrollLeft = x;
    }
  }

  function paint(animate) {
    var p = nameAt(mala.i);
    countEl.textContent = '';
    countEl.appendChild(document.createTextNode(gu(mala.i + 1)));
    countEl.appendChild(el('i', null, ' / ' + gu(NAMES.length)));

    faceEl.querySelector('.nm').textContent = p[0];
    faceEl.querySelector('.rm').textContent = p[1];
    faceEl.querySelector('.mn').textContent = p[2];
    if (animate && !reduceMotion) {
      faceEl.classList.remove('turn');
      /* forcing layout is what actually restarts a CSS animation */
      void faceEl.offsetWidth;
      faceEl.classList.add('turn');
    }

    for (var i = 0; i < beads.length; i++) {
      var c = beads[i].className.replace(/ (told|now)\b/g, '');
      if (i < mala.i) c += ' told';
      else if (i === mala.i) c += ' now';
      beads[i].className = c;
    }
    centreBead(animate);

    prevEl.disabled = mala.i === 0;
    var last = mala.i === NAMES.length - 1;
    nextEl.disabled = last;
    nextEl.textContent = last ? 'પૂરું' : 'આગળ';
    doneEl.hidden = !mala.done;

    markTold();
  }

  function render() {
    var reciting = !mala.list;
    threadEl.hidden = !reciting;
    faceEl.hidden = !reciting;
    nav.hidden = !reciting;
    doneEl.hidden = !reciting || !mala.done;
    note.hidden = !reciting;
    if (mala.list) buildList();
    listEl.hidden = !mala.list;
    toggle.textContent = mala.list ? 'મણકા ફેરવો' : 'યાદી જુઓ';
    if (reciting) centreBead(false);
  }

  paint(false);
  render();
  /* the thread has no width until the sheet has been laid out */
  requestAnimationFrame(function () { centreBead(false); });
}

VIEWS.names = viewNames;


/* ───────────────────────────────────────────────────────────────
   6c. પ્રશ્નોત્તરી — ten questions
       Same rule as the mala: progress lives out here, so closing
       the panel mid-game and coming back keeps your place. Nothing
       is persisted past the visit — there is no high score to chase.
   ─────────────────────────────────────────────────────────────── */
var quiz = null;

/* Fisher–Yates. Shuffling both the order of the questions and the
   order of each one's answers, so the right answer is never in a
   learnable position. */
function shuffled(arr) {
  var a = arr.slice(), i, j, t;
  for (i = a.length - 1; i > 0; i--) {
    j = Math.floor(Math.random() * (i + 1));
    t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function newQuiz() {
  quiz = {
    i: 0,
    picked: [],                 /* index into q.opts, per question */
    /* Set once the result has been shown. A round you finished is a
       thing you did — closing the panel to look at Bappa and coming
       back should return you to your score, not to the last question
       with the result thrown away. */
    done: false,
    qs: shuffled(QUIZ).map(function (src) {
      var opts = shuffled([src.a].concat(src.o));
      return { q: src.q, why: src.why, opts: opts, right: opts.indexOf(src.a) };
    })
  };
  return quiz;
}

/* The `why` lines carry <b> for the fact being taught. Rather than
   hand author text to innerHTML, split on the tag and build the two
   node types by hand — same result, and nothing in this file can ever
   parse as markup by accident. */
function richText(parent, s) {
  var parts = String(s).split(/<b>|<\/b>/), i;
  for (i = 0; i < parts.length; i++) {
    if (!parts[i]) continue;
    if (i % 2) {
      var b = document.createElement('b');
      b.textContent = parts[i];
      parent.appendChild(b);
    } else {
      parent.appendChild(document.createTextNode(parts[i]));
    }
  }
}

/* a modak: pointed pleated top, wide rounded base, sitting on its dish.
   Two pleat strokes run down from the tip — that is what tells it from
   a laddu or a bell at this size. */
var MODAK_PATH = 'M12 2.8c3.2 4.1 6.6 8.7 6.6 11.6 0 2.6-2.9 4.2-6.6 4.2' +
                 's-6.6-1.6-6.6-4.2C5.4 11.5 8.8 6.9 12 2.8z' +
                 'M12 3.4v14.9 M9.2 7.6c-.5 3.4-.6 7-.3 10.4' +
                 'M14.8 7.6c.5 3.4.6 7 .3 10.4' +
                 'M4.9 20.2h14.2';

function scoreOf() {
  var n = 0, i;
  for (i = 0; i < quiz.qs.length; i++) {
    if (quiz.picked[i] === quiz.qs[i].right) n++;
  }
  return n;
}

/* The blessing is tiered, and the bottom tier is not a consolation —
   getting it wrong and being told why is the point of the thing. */
function blessingFor(n, total) {
  if (n === total) return 'તું તો બાપ્પાનો લાડકો! એકેય ભૂલ નહીં.';
  if (n >= total - 2) return 'બહુ સરસ! બાપ્પાની કથા તને બરાબર આવડે છે.';
  if (n >= total / 2) return 'સારું! હવે જે રહી ગયું એ પણ યાદ રહી જશે.';
  return 'વાંધો નહીં — દરેક ખોટો જવાબ પણ એક નવી વાત શીખવી ગયો.';
}

function viewQuiz(root) {
  if (!quiz) newQuiz();

  function el(tag, cls, txt) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt != null) e.textContent = txt;
    return e;
  }

  function modak() {
    var s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    s.setAttribute('class', 'mk');
    s.setAttribute('viewBox', '0 0 24 24');
    s.setAttribute('aria-hidden', 'true');
    var p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', MODAK_PATH);
    s.appendChild(p);
    return s;
  }

  /* ── header: ten beads and the count ── */
  var head = el('div', 'q-head');
  var track = el('div', 'q-track');
  track.setAttribute('aria-hidden', 'true');     /* the count says it in words */
  var dots = [];
  for (var d = 0; d < quiz.qs.length; d++) {
    var dot = el('span', 'q-dot');
    dots.push(dot);
    track.appendChild(dot);
  }
  head.appendChild(track);
  var ofEl = el('span', 'q-of');
  head.appendChild(ofEl);
  root.appendChild(head);

  /* ── the question on its leaf ── */
  var leaf = el('div', 'q-leaf');
  var qEl = el('h3');
  leaf.appendChild(qEl);
  root.appendChild(leaf);

  /* ── the four offerings ── */
  var optsEl = el('div', 'q-opts');
  /* a radiogroup would promise arrow-key selection we don't implement;
     these are four buttons and Tab reaches each one */
  optsEl.setAttribute('role', 'group');
  root.appendChild(optsEl);

  /* ── the teaching line, announced when it appears ── */
  var whyEl = el('p', 'q-why');
  whyEl.hidden = true;
  whyEl.setAttribute('aria-live', 'polite');
  root.appendChild(whyEl);

  var nav = el('div', 'q-nav');
  var nextEl = el('button', 'turn-next');
  nextEl.type = 'button';
  nextEl.addEventListener('click', function () {
    if (quiz.i < quiz.qs.length - 1) {
      quiz.i++;
      paint();
      /* a new question starts at the question, not wherever the last
         answer left the scroll */
      var sheet = nextEl.closest ? nextEl.closest('.sheet') : null;
      if (sheet) sheet.scrollTop = 0;
    } else showScore();
  });
  nav.appendChild(nextEl);
  root.appendChild(nav);

  function answered() { return quiz.picked[quiz.i] != null; }

  function pick(k) {
    if (answered()) return;
    quiz.picked[quiz.i] = k;
    paint();
    /* move focus to the way forward — after answering, that is the only
       thing left to do, and on a phone it is below the fold */
    nextEl.focus({ preventScroll: true });
    /* preventScroll keeps portrait from jumping, where the button is
       already in view. Landscape is 390px tall and the button lands well
       under the fold, so scroll it up — but only when it is actually out
       of sight, and only as far as it needs. */
    reveal(nextEl);
  }

  /* scroll the sheet just enough to bring an element fully into view */
  function reveal(node) {
    var sheet = node.closest ? node.closest('.sheet') : null;
    if (!sheet) return;
    var nb = node.getBoundingClientRect(), sb = sheet.getBoundingClientRect();
    var under = nb.bottom - (sb.bottom - 12);
    var over = (sb.top + 12) - nb.top;
    var by = under > 0 ? under : (over > 0 ? -over : 0);
    if (!by) return;
    if (!reduceMotion && sheet.scrollBy) sheet.scrollBy({ top: by, behavior: 'smooth' });
    else sheet.scrollTop += by;
  }

  function paint() {
    var Q = quiz.qs[quiz.i];
    var mine = quiz.picked[quiz.i];
    var done = mine != null;

    ofEl.textContent = gu(quiz.i + 1) + ' / ' + gu(quiz.qs.length);

    for (var i = 0; i < dots.length; i++) {
      var c = 'q-dot';
      var p = quiz.picked[i];
      if (p != null) c += p === quiz.qs[i].right ? ' right' : ' wrong';
      if (i === quiz.i) c += ' at';
      dots[i].className = c;
    }

    qEl.textContent = Q.q;

    optsEl.textContent = '';
    for (var k = 0; k < Q.opts.length; k++) {
      var b = el('button', 'q-opt');
      b.type = 'button';
      b.appendChild(modak());
      b.appendChild(el('span', null, Q.opts[k]));
      if (done) {
        b.disabled = true;
        if (k === Q.right) b.className += ' is-right';
        else if (k === mine) b.className += ' is-mine';
        else b.className += ' is-dim';
      } else {
        (function (idx) {
          b.addEventListener('click', function () { pick(idx); });
        })(k);
      }
      optsEl.appendChild(b);
    }

    whyEl.hidden = !done;
    if (done) {
      whyEl.textContent = '';
      richText(whyEl, Q.why);
    }

    nextEl.hidden = !done;
    nextEl.textContent = quiz.i === quiz.qs.length - 1 ? 'પરિણામ' : 'આગળ';
  }

  function showScore() {
    var n = scoreOf(), total = quiz.qs.length;
    quiz.done = true;

    root.textContent = '';
    var wrap = el('div', 'q-score');

    var tally = el('div', 'tally');
    tally.appendChild(document.createTextNode(gu(n)));
    tally.appendChild(el('i', null, ' / ' + gu(total)));
    /* the number is the result; announce it, and the blessing with it */
    tally.setAttribute('aria-live', 'polite');
    wrap.appendChild(tally);

    wrap.appendChild(el('p', 'bless', blessingFor(n, total)));

    var again = el('div', 'again');
    var btn = el('button', 'turn-next', 'ફરી રમો');
    btn.type = 'button';
    btn.addEventListener('click', function () {
      newQuiz();
      root.textContent = '';
      viewQuiz(root);
    });
    again.appendChild(btn);
    wrap.appendChild(again);

    root.appendChild(wrap);
    btn.focus({ preventScroll: true });
  }

  if (quiz.done) showScore(); else paint();
}

VIEWS.quiz = viewQuiz;


/* ───────────────────────────────────────────────────────────────
   6d. શુભકામનાઓ — ring the bell, then pass the blessing on
   ─────────────────────────────────────────────────────────────── */

/* The bag is refilled and reshuffled when it empties, so you see all 24
   before you see any of them twice — and the join is checked so the
   last of one bag is never the first of the next. A plain random pick
   repeats within a few taps and reads as broken. */
var blessBag = [], blessLast = null;
function nextBlessing() {
  if (!blessBag.length) {
    blessBag = shuffled(BLESSINGS);
    if (blessBag.length > 1 && blessBag[blessBag.length - 1] === blessLast) {
      blessBag.unshift(blessBag.pop());
    }
  }
  blessLast = blessBag.pop();
  return blessLast;
}

/* Drawn at 1080×1080 because that is what WhatsApp and Instagram want.
   Everything is procedural — no image to fetch, so the card works from
   a file:// page with no network at all. */
var CARD = 1080;
/* The card is drawn in the same two faces as the page. Declared here
   because drawCard() below reads them. */
var SERIF_STACK = '"Noto Serif Gujarati", Shruti, "Nirmala UI", Georgia, serif';
var SANS_STACK  = '"Noto Sans Gujarati", Shruti, "Nirmala UI", system-ui, sans-serif';

function fitFont(ctx, text, px, weight, family, maxW) {
  var s = px;
  while (s > 18) {
    ctx.font = weight + ' ' + s + 'px ' + family;
    if (ctx.measureText(text).width <= maxW) break;
    s -= 2;
  }
  return s;
}

function wrapLines(ctx, text, maxW) {
  var words = String(text).split(' '), lines = [], line = '';
  for (var i = 0; i < words.length; i++) {
    var test = line ? line + ' ' + words[i] : words[i];
    if (ctx.measureText(test).width > maxW && line) {
      lines.push(line); line = words[i];
    } else { line = test; }
  }
  if (line) lines.push(line);
  return lines;
}

/* one repeat of a Patola-ish double-ikat band: diamond, bar, diamond */
function patolaBand(ctx, x, y, w, h) {
  var unit = 60, n = Math.ceil(w / unit), i;
  ctx.save();
  ctx.translate(x, y);
  for (i = 0; i < n; i++) {
    var ox = i * unit, mid = h / 2;
    ctx.fillStyle = i % 2 ? '#6E0F2A' : '#1E7A5E';
    ctx.beginPath();
    ctx.moveTo(ox + unit / 2, 2);
    ctx.lineTo(ox + unit - 4, mid);
    ctx.lineTo(ox + unit / 2, h - 2);
    ctx.lineTo(ox + 4, mid);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(242,228,201,.55)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#D9A521';
    ctx.beginPath();
    ctx.arc(ox + unit / 2, mid, 3.4, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function marigoldCluster(ctx, cx, cy, r) {
  var p, i;
  for (p = 0; p < 3; p++) {
    var ang = p * 2.2, dx = Math.cos(ang) * r * 0.9, dy = Math.sin(ang) * r * 0.9;
    var rr = r * (p === 0 ? 1 : 0.66);
    ctx.fillStyle = p % 2 ? '#F5A11B' : '#D9761B';
    for (i = 0; i < 8; i++) {
      var a = (i / 8) * Math.PI * 2;
      ctx.beginPath();
      ctx.ellipse(cx + dx + Math.cos(a) * rr * .55, cy + dy + Math.sin(a) * rr * .55,
                  rr * .42, rr * .30, a, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = '#6E0F2A';
    ctx.beginPath();
    ctx.arc(cx + dx, cy + dy, rr * .26, 0, Math.PI * 2);
    ctx.fill();
  }
}

/* The same five-petal mark the back control wears, redrawn in canvas
   calls from the identical coordinates. The card is the piece of this
   site that travels on its own, so it carries the site's own glyph
   rather than a second lotus invented for the occasion.
   Plain beziers, not Path2D — nothing to feature-detect. */
function lotusGlyph(ctx, cx, cy, size, color) {
  var k = size / 48;
  ctx.save();
  ctx.translate(cx - 24 * k, cy - 22 * k);
  ctx.scale(k, k);
  ctx.strokeStyle = color;
  ctx.lineWidth = 2.4;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  ctx.beginPath();                       /* the upright centre petal */
  ctx.moveTo(24, 10);
  ctx.bezierCurveTo(28, 15, 28, 22, 24, 27);
  ctx.bezierCurveTo(20, 22, 20, 15, 24, 10);
  ctx.closePath();
  ctx.stroke();

  ctx.beginPath();                       /* the open bowl of outer petals */
  ctx.moveTo(24, 27);
  ctx.bezierCurveTo(20, 23, 14, 22, 9, 24);
  ctx.bezierCurveTo(12, 29, 18, 32, 24, 31);
  ctx.bezierCurveTo(30, 32, 36, 29, 39, 24);
  ctx.bezierCurveTo(34, 22, 28, 23, 24, 27);
  ctx.closePath();
  ctx.stroke();

  ctx.beginPath();                       /* the two leaning side petals */
  ctx.moveTo(14, 14);
  ctx.bezierCurveTo(19, 16, 22, 21, 23, 27);
  ctx.moveTo(34, 14);
  ctx.bezierCurveTo(29, 16, 26, 21, 25, 27);
  ctx.stroke();

  ctx.restore();
}

function drawCard(cv, name, blessing) {
  var ctx = cv.getContext('2d');
  var S = CARD, pad = 46, inner = pad + 54;

  /* night ground */
  var g = ctx.createLinearGradient(0, 0, 0, S);
  g.addColorStop(0, '#24103F');
  g.addColorStop(0.55, '#1A0B2E');
  g.addColorStop(1, '#0E0619');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, S, S);

  /* a warm pool behind the name, as if a diya were standing just out
     of frame */
  var glow = ctx.createRadialGradient(S / 2, S * .47, 20, S / 2, S * .47, S * .52);
  glow.addColorStop(0, 'rgba(245,161,27,.22)');
  glow.addColorStop(1, 'rgba(245,161,27,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, S, S);

  /* Patola border on all four sides */
  var bw = 38;
  ctx.save();
  patolaBand(ctx, pad, pad, S - pad * 2, bw);
  ctx.translate(S, S); ctx.rotate(Math.PI);
  patolaBand(ctx, pad, pad, S - pad * 2, bw);
  ctx.restore();
  ctx.save();
  ctx.translate(0, S); ctx.rotate(-Math.PI / 2);
  patolaBand(ctx, pad, pad, S - pad * 2, bw);
  ctx.translate(S, S); ctx.rotate(Math.PI);
  patolaBand(ctx, pad, pad, S - pad * 2, bw);
  ctx.restore();

  /* inner gold rule */
  ctx.strokeStyle = 'rgba(217,165,33,.75)';
  ctx.lineWidth = 2;
  ctx.strokeRect(inner, inner, S - inner * 2, S - inner * 2);

  /* corners */
  marigoldCluster(ctx, inner + 6, inner + 6, 26);
  marigoldCluster(ctx, S - inner - 6, inner + 6, 26);
  marigoldCluster(ctx, inner + 6, S - inner - 6, 26);
  marigoldCluster(ctx, S - inner - 6, S - inner - 6, 26);

  var maxW = S - inner * 2 - 96;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';

  lotusGlyph(ctx, S / 2, 250, 140, 'rgba(217,165,33,.9)');

  /* The seal is fixed to the bottom and the lotus to the top; the block
     between them is centred in what's left rather than starting at a
     fixed y. A one-line blessing and a three-line one then both sit in
     the middle of the card instead of leaving a quarter of it empty. */
  var LBL = 40, NAME_PX = 118, LINE = 66, GAP = 34;
  var top = 316, bottom = 826;

  var nameSize = 0;
  if (name) nameSize = fitFont(ctx, name, NAME_PX, '700', SERIF_STACK, maxW);

  /* lay the blessing out first, since its line count sets the height */
  ctx.font = '600 46px ' + SERIF_STACK;
  var blSize = 46;
  var lines = wrapLines(ctx, blessing, maxW);
  if (lines.length > 3) {
    blSize = 40;
    ctx.font = '600 ' + blSize + 'px ' + SERIF_STACK;
    lines = wrapLines(ctx, blessing, maxW);
  }

  var blockH = lines.length * LINE;
  if (name) blockH += LBL + GAP + nameSize + GAP;
  var y = (top + bottom) / 2 - blockH / 2;

  if (name) {
    y += LBL;
    ctx.fillStyle = '#C9B695';
    ctx.font = '400 ' + LBL + 'px ' + SANS_STACK;
    ctx.fillText('પ્રિય', S / 2, y);
    y += GAP + nameSize;
    ctx.font = '700 ' + nameSize + 'px ' + SERIF_STACK;
    ctx.fillStyle = '#D9A521';
    ctx.shadowColor = 'rgba(245,161,27,.5)';
    ctx.shadowBlur = 30;
    ctx.fillText(name, S / 2, y);
    ctx.shadowBlur = 0;
    y += GAP;
  }

  ctx.fillStyle = '#F2E4C9';
  ctx.font = '600 ' + blSize + 'px ' + SERIF_STACK;
  for (var i = 0; i < lines.length; i++) {
    ctx.fillText(lines[i], S / 2, y + LINE * (i + 0.78));
  }

  /* the seal */
  var sy = S - inner - 96;
  ctx.strokeStyle = 'rgba(217,165,33,.45)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(S / 2 - 130, sy - 54);
  ctx.lineTo(S / 2 + 130, sy - 54);
  ctx.stroke();

  ctx.fillStyle = '#D9A521';
  ctx.font = '700 44px ' + SERIF_STACK;
  ctx.fillText('હરિવંદના કા રાજા', S / 2, sy);

  ctx.fillStyle = 'rgba(201,182,149,.78)';
  ctx.font = '400 24px ' + SANS_STACK;
  /* Set plainly. Spacing this out by inserting spaces between letters
     would split the conjuncts — બાપ્પા would render as બા પ્ પા — which
     is the one thing a Gujarati card must not do. */
  ctx.fillText('ગણપતિ બાપ્પા મોરિયા', S / 2, sy + 42);
}

/* Canvas does not wait for webfonts — draw too early and the card is
   rendered in the fallback face, silently. Ask for the two faces we
   actually use, with a Gujarati sample so the right subset loads. */
var cardFontsReady = null;
function whenCardFonts() {
  if (cardFontsReady) return cardFontsReady;
  var d = document;
  if (!d.fonts || !d.fonts.load) {
    cardFontsReady = Promise.resolve();
  } else {
    cardFontsReady = Promise.all([
      d.fonts.load('700 96px "Noto Serif Gujarati"', 'બાપ્પા'),
      d.fonts.load('400 40px "Noto Sans Gujarati"', 'પ્રિય')
    ]).catch(function () {});
  }
  return cardFontsReady;
}

function cardBlob(cv) {
  return new Promise(function (res) {
    if (cv.toBlob) cv.toBlob(function (b) { res(b); }, 'image/png');
    else res(null);
  });
}

function viewWishes(root) {
  var blessing = null;

  /* cord, crown, body, rim, clapper */
  svg.appendChild(svgEl('path', { 'class': 'br', d: 'M60 4v12' }));
  svg.appendChild(svgEl('path', { 'class': 'br', d: 'M60 16a9 9 0 1 1 0 18 9 9 0 1 1 0-18z' }));
  svg.appendChild(svgEl('path', { 'class': 'br', d: 'M60 34c-4 0-7 3-7 7v4c-16 6-27 22-27 41 0 5-3 9-7 12h82c-4-3-7-7-7-12 0-19-11-35-27-41v-4c0-4-3-7-7-7z' }));
  svg.appendChild(svgEl('path', { 'class': 'br', d: 'M15 98h90' }));
  svg.appendChild(svgEl('path', { 'class': 'bd', d: 'M33 74h54' }));
  svg.appendChild(svgEl('path', { 'class': 'bd', d: 'M28 86h64' }));
  svg.appendChild(svgEl('path', { 'class': 'br', d: 'M60 98v14' }));
  svg.appendChild(svgEl('circle', { 'class': 'cl', cx: '60', cy: '118', r: '7' }));
  btn.appendChild(svg);
  bellWrap.appendChild(btn);
  bellWrap.appendChild(el('p', 'w-hint', 'ઘંટ પર ટચ કરો'));
  root.appendChild(bellWrap);

  /* ── the blessing ── */
  var blessEl = el('div', 'w-bless empty', 'ઘંટ વાગશે ને બાપ્પાનો આશીર્વાદ અહીં આવશે.');
  blessEl.setAttribute('aria-live', 'polite');

  send.appendChild(el('h3', null, 'કોઈને મોકલો'));
  send.appendChild(el('p', null,
    'નામ લખો — આ જ આશીર્વાદનું કાર્ડ બની જશે, જે તમે વૉટ્સએપ પર મોકલી શકો.'));

  var field = el('label', 'w-field');
  field.appendChild(el('span', null, 'જેને મોકલવું છે એનું નામ'));
  var input = document.createElement('input');
  input.type = 'text';
  input.maxLength = 22;         /* longer than this and the card stops being a card */
  input.placeholder = 'દા.ત. મીરા';
  input.setAttribute('autocomplete', 'off');
  field.appendChild(input);
  send.appendChild(field);

  var cardWrap = el('div', 'w-card');
  var cv = document.createElement('canvas');
  cv.width = CARD; cv.height = CARD;
  cv.setAttribute('role', 'img');
  cardWrap.appendChild(cv);
  send.appendChild(cardWrap);

  var canShareFile = !!(navigator.share && navigator.canShare);
  var saveBtn = el('button', canShareFile ? 'quiet' : 'turn-next', 'ઇમેજ સેવ કરો');
  saveBtn.type = 'button';
  var shareBtn = el('button', 'turn-next', 'શેર કરો');
  shareBtn.type = 'button';
  /* on a phone the wish is going straight to WhatsApp, so share leads;
     on a desktop with no share sheet, save is the only real action and
     there is no point showing a button that would fall back to it */
  if (canShareFile) { acts.appendChild(saveBtn); acts.appendChild(shareBtn); }
  else { acts.appendChild(saveBtn); }
  send.appendChild(acts);
  send.appendChild(el('p', 'w-note', 'કાર્ડ ૧૦૮૦×૧૦૮૦ — વૉટ્સએપ ને ઇન્સ્ટાગ્રામ માટે તૈયાર.'));
  root.appendChild(send);

  /* ── card painting ── */
  var pending = false;
  function paintCard() {
    if (pending) return;
    pending = true;
    whenCardFonts().then(function () {
      pending = false;

    });

  input.addEventListener('input', function () {
    clearTimeout(typing);
    typing = setTimeout(paintCard, 120);

VIEWS.wishes = viewWishes;


/* ───────────────────────────────────────────────────────────────
   6e. ગેલેરી — the wall
       Eighty-odd photographs of five days. The whole design problem
       here is restraint: the pictures are the content, and every
       device I could add competes with them. So the section adds
       exactly two things the photographs cannot carry themselves —
       which day each belongs to, and a way to see one large.

       No invented captions. I do not know these people's names or
       what any given frame is of, and a wall of guessed labels
       ('ભક્તિ', 'ઉલ્લાસ') under real photographs of real families
       is worse than no labels at all.
   ─────────────────────────────────────────────────────────────── */

/* Flattened once: the lightbox walks one list, the wall reads the
   groups. Both point at the same objects, so `i` means the same
   thing in either. */
var GPHOTOS = (function () {
  var out = [], g, j;
  for (g = 0; g < GALLERY.length; g++) {
    for (j = 0; j < GALLERY[g].items.length; j++) {
      var it = GALLERY[g].items[j];
      it.day = GALLERY[g].day;
      it.i = out.length;
      out.push(it);
    }
  }
  return out;
})();

/* images/thumbs/x.jpg → images/full/x.jpg. The wall loads the small
   one; opening a photograph fetches the large one over the top of it,
   so the lightbox is never blank while it downloads. */
function fullSrc(src) { return src.replace('/thumbs/', '/full/'); }

/* A screen reader lands on eighty buttons in a row. "ફોટો ૩, ૨૭ ઓગસ્ટ"
   at least says which of them this is and which day it belongs to. */
function photoLabel(p) {
  return 'ફોટો ' + gu(p.i + 1) + ', ' + p.day;
}

var lensEl = null, lensImg = null, lensOf = null,
    lensPrev = null, lensNext = null,
    lensAt = -1, lensReturn = null;

function buildLens() {
  if (lensEl) return;
  lensEl = document.getElementById('lens');

  function ctl(cls, d, label) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = cls;
    b.setAttribute('aria-label', label);
    b.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="' + d + '"/></svg>';
    lensEl.appendChild(b);
    return b;
  }

  lensOf = document.createElement('p');
  lensOf.className = 'lens-of';
  lensOf.setAttribute('aria-live', 'polite');

  var fig = document.createElement('div');
  fig.className = 'lens-fig';
  lensImg = document.createElement('img');
  lensImg.alt = '';
  fig.appendChild(lensImg);

  lensEl.appendChild(fig);
  lensEl.appendChild(lensOf);

  var x = ctl('lens-x', 'M6 6l12 12M18 6L6 18', 'બંધ કરો');
  lensPrev = ctl('lens-p', 'M15 5l-7 7 7 7', 'પાછળનો ફોટો');
  lensNext = ctl('lens-n', 'M9 5l7 7-7 7', 'આગળનો ફોટો');

  x.addEventListener('click', closeLens);
  lensPrev.addEventListener('click', function () { stepLens(-1); });
  lensNext.addEventListener('click', function () { stepLens(1); });

  /* Tapping the photograph itself closes it — the gesture everyone
     already tries first. The controls stopPropagation by sitting
     outside .lens-fig. */
  fig.addEventListener('click', function (e) {
    if (e.target === lensImg || e.target === fig) closeLens();
  });

  /* Swipe, because this will mostly be read on a phone. Only a
     decisively horizontal drag counts, so a vertical flick meant to
     scroll does not skip a photograph. */
  var sx = 0, sy = 0, tracking = false;
  lensEl.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) { tracking = false; return; }
    tracking = true; sx = e.touches[0].clientX; sy = e.touches[0].clientY;
  }, { passive: true });
  lensEl.addEventListener('touchend', function (e) {
    if (!tracking) return;
    tracking = false;
    var t = e.changedTouches[0];
    var dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 46 && Math.abs(dx) > Math.abs(dy) * 1.6) stepLens(dx < 0 ? 1 : -1);
  }, { passive: true });
}

function showLens(i) {
  if (i < 0 || i >= GPHOTOS.length) return;
  lensAt = i;
  var p = GPHOTOS[i];

  /* The thumbnail is already decoded and in cache, so it paints this
     frame; the full-size file replaces it when it arrives. You never
     look at an empty rectangle waiting for a download. */
  lensImg.classList.remove('shown');
  lensImg.src = p.src;
  lensImg.alt = photoLabel(p);
  var big = new Image();
  big.onload = function () {
    if (lensAt !== i) return;            /* you moved on while it loaded */
    lensImg.src = big.src;
    lensImg.classList.add('shown');
  };
  big.onerror = function () {
    if (lensAt === i) lensImg.classList.add('shown');
  };
  big.src = fullSrc(p.src);
  /* a cached file can fire onload before this line, so show it anyway */
  requestAnimationFrame(function () {
    if (lensAt === i) lensImg.classList.add('shown');
  });

  lensOf.textContent = gu(i + 1) + ' / ' + gu(GPHOTOS.length) + ' · ' + p.day;
  lensPrev.disabled = i === 0;
  lensNext.disabled = i === GPHOTOS.length - 1;
}

function openLens(i, trigger) {
  buildLens();
  lensReturn = trigger || null;
  lensEl.classList.add('on');
  showLens(i);
  requestAnimationFrame(function () { lensEl.classList.add('in'); });
  document.addEventListener('keydown', lensKeys, true);
  lensEl.querySelector('.lens-x').focus();
}

function closeLens() {
  if (!lensEl || lensAt < 0) return;
  lensAt = -1;
  lensEl.classList.remove('in');
  document.removeEventListener('keydown', lensKeys, true);
  var back = lensReturn;
  lensReturn = null;
  setTimeout(function () {
    if (lensAt < 0) { lensEl.classList.remove('on'); lensImg.src = ''; }
  }, 300);
  /* back to the frame you opened, not to the top of the wall */
  if (back && back.isConnected) back.focus();
}

function stepLens(d) {
  var n = lensAt + d;
  if (n < 0 || n >= GPHOTOS.length) return;
  showLens(n);
}

/* Capture phase, so Escape closes the photograph rather than the whole
   panel underneath it — the panel's own handler is on document too. */
function lensKeys(e) {
  if (lensAt < 0) return;
  if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeLens(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); stepLens(1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); stepLens(-1); }
  else if (e.key === 'Tab') {
    /* three controls, and Tab stays among them while a photo is open */
    e.stopPropagation();
  }
}

function viewGallery(root, flat) {
  function el(tag, cls, txt) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt != null) e.textContent = txt;
    return e;
  }

  if (!GPHOTOS.length) {
    root.appendChild(el('p', 'g-note',
      'ફોટા હજી ઉમેરાયા નથી. images/ ફોલ્ડરમાં ફોટા મૂકીને make-web-images.py ચલાવો.'));
    return;
  }

  GALLERY.forEach(function (grp) {
    var head = el('div', 'g-day');
    head.appendChild(el('h3', null, grp.day));
    head.appendChild(el('span'));
    head.appendChild(el('small', null, gu(grp.items.length) + ' ફોટા'));
    root.appendChild(head);

    var wall = el('div', 'g-wall');
    grp.items.forEach(function (p) {
      var b = el('button', 'g-fr');
      b.type = 'button';

      var im = el('img');
      im.src = p.src;
      im.alt = photoLabel(p);
      im.loading = 'lazy';
      im.decoding = 'async';
      /* the attributes, not CSS — this is what reserves the box */
      im.width = p.w; im.height = p.h;

      im.addEventListener('error', function () {
        b.classList.add('gone');
        b.disabled = true;
        /* the frame keeps the shape the photograph would have had */
        b.style.aspectRatio = p.w + ' / ' + p.h;
        im.alt = '';
      });

      b.appendChild(im);
      b.addEventListener('click', function () { openLens(p.i, b); });
      wall.appendChild(b);
    });
    root.appendChild(wall);
  });

  root.appendChild(el('p', 'g-note',
    'કોઈ પણ ફોટો પર ટચ કરો — મોટો દેખાશે. ડાબે-જમણે સરકાવીને આગળ-પાછળ જઈ શકાય.'));
}
VIEWS.gallery = viewGallery;



function openSection(id, trigger) {
  var s = sectionById(id);
  if (!s || active === id) return;
  active = id;
  lastTrigger = trigger || null;

  document.getElementById('panelTitle').textContent = s.gu;
  document.getElementById('panelSub').textContent = s.sub;

  var body = document.getElementById('panelBody');
  body.textContent = '';
  body.className = 'body-' + id;
  if (VIEWS[id]) {
    VIEWS[id](body);
  } else {
    var p = document.createElement('p');
    p.textContent = 'આ વિભાગ તૈયાર થઈ રહ્યો છે.';
    body.appendChild(p);
  }

  sheetEl.className = 'sheet frame-' + id;
  panelEl.classList.add('open');
  document.body.classList.add('reading');
  setDock(false);
  document.getElementById('back').classList.add('on');

  framePanel();

  sheetEl.scrollTop = 0;
  sheetEl.focus({ preventScroll: true });
}

function closeSection() {
  if (!active) return;
  /* A photograph open over the gallery belongs to the gallery; leaving
     it on screen after the panel has gone would strand it. */
  if (lensAt >= 0) closeLens();
  active = null;
  panelEl.classList.remove('open');
  document.body.classList.remove('reading');
  setDock(true);
  document.getElementById('back').classList.remove('on');
  goto('home');
  if (lastTrigger && lastTrigger.isConnected) lastTrigger.focus();
  lastTrigger = null;
}

/* aria-modal is advisory; this is what actually keeps Tab in the dialog. */
function trapTab(e) {
  if (e.key !== 'Tab' || !active) return;
  var f = panelEl.querySelectorAll('button:not([disabled]),a[href],input,select,textarea,[tabindex]:not([tabindex="-1"])');
  var live = [];
  for (var i = 0; i < f.length; i++) if (f[i].offsetParent !== null) live.push(f[i]);
  var back = document.getElementById('back');
  live.push(back);
  if (!live.length) return;
  var first = live[0], last = live[live.length - 1];
  if (e.shiftKey && (document.activeElement === first || document.activeElement === sheetEl)) {
    e.preventDefault(); last.focus();
  } else if (!e.shiftKey && document.activeElement === last) {
    e.preventDefault(); first.focus();
  }
}

function bindNav() {
  panelEl = document.getElementById('panel');
  sheetEl = panelEl.querySelector('.sheet');
  sheetEl.tabIndex = -1;

  panelEl.addEventListener('click', function (e) {
    if (e.target.getAttribute('data-close') === '1') closeSection();
  });
  document.getElementById('back').addEventListener('click', closeSection);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && active) { e.preventDefault(); closeSection(); }
    else trapTab(e);
  });
}


/* ───────────────────────────────────────────────────────────────
   6. LOOP — with a framerate watchdog that can drop a tier live
   ─────────────────────────────────────────────────────────────── */
var fps = { frames: 0, since: 0, low: 0, probed: false };

function measure(dt) {
  fps.frames++; fps.since += dt;
  if (fps.since < 1) return;
  var v = fps.frames / fps.since;
  fps.frames = 0; fps.since = 0;
  window.__fps = Math.round(v);

  /* The intro is the most expensive second of this page's life — shaders
     compile, canvas textures are built, fonts land. Judging the device on
     that would permanently downgrade a phone that runs the settled scene
     at 60, and there is no path back up. So the watchdog stays quiet
     until the intro is over, and then discards its first reading as
     well: the second the intro ends is still paying for it. */
  if (intro.running) { fps.low = 0; return; }
  if (!fps.probed) { fps.probed = true; fps.low = 0; return; }

  if (v < 40 && tier > TIER.LOW) {
    fps.low++;
    if (fps.low >= 2) { fps.low = 0; downgrade(); }
  } else {
    fps.low = 0;
  }
}

function downgrade() {
  applyTier(tier - 1);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, Q.maxDpr));
  renderer.shadowMap.enabled = Q.shadows;
  if (water) water.material.uniforms.uDetail.value = Q.waterDetail;
  window.dispatchEvent(new CustomEvent('tierchange', { detail: tier }));
}

var paused = false;

/* ── The aarti flare. Earned by reciting all ૧૦૮ names, and the only
      thing in the scene louder than the intro.

      It builds nothing new. One scalar rises and falls, and everything
      that already breathes — the six wicks, the prabhavali, the glow
      under the flower — simply breathes harder for five seconds. A
      finale made of extra objects would cost a phone dearly for a
      moment almost nobody reaches; a finale made of gain costs nothing
      at all. ── */
var aartiT = 0, aartiEnds = -1;
var AARTI_LEN = 5.2;

function fireAarti() { aartiEnds = t0 + AARTI_LEN; }

function updateAarti() {
  if (aartiEnds < 0) { aartiT = 0; return; }
  var left = aartiEnds - t0;
  if (left <= 0) { aartiT = 0; aartiEnds = -1; return; }
  /* quick catch, long fall — a wick takes the flame at once and lets
     it go slowly, which is the opposite of a symmetric envelope */
  aartiT = Math.min(1, (AARTI_LEN - left) / 0.30) * Math.min(1, left / 1.8);
  if (reduceMotion) aartiT = Math.min(aartiT, 0.35);
}

function frame() {
  var dt = Math.min(clock.getDelta(), 0.05);   /* clamp after a tab switch */
  if (paused) return;
  t0 += dt;
  measure(dt);

  if (water) water.material.uniforms.uTime.value = t0;
  if (intro.running) updateIntro(dt);
  updateAarti();
  updateLotus();
  updateBappa(dt);
  updateAura();
  updateDiyas();
  updateDock();
  updateCamera(dt);
  renderer.render(scene, camera);
}

function onResize() {
  var w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  /* A portrait viewport has barely ±13° of horizontal view, and the open
     flower is 4 units across — so portrait both widens the lens and
     stands further back, or the outer petals fall off both sides. */
  var portrait = h > w;
  STATION.home.fov = portrait ? 56 : 42;
  /* Landscape stands much closer than portrait. At r 7.8 the flower was
     about 200px of an 844px frame — a small pink cluster adrift in empty
     night, with the dock sitting on top of it. Now the buttons are out on
     the flanks, the camera can come in and let the lotus be the frame. */
  STATION.home.r   = portrait ? 8.6 : 5.4;
  STATION.home.ty  = portrait ? 1.44 : 1.48;
  /* High enough to look a little way into the bowl — from water level the
     outer plate is edge-on and the whole flower collapses into a thin band.
     Not so high that the rings splay onto one plane and it becomes a flower
     seen from above rather than a throne. That window turned out to be
     narrow: 0.22 is a band, 0.38 is a rosette, and this sits between. */
  STATION.home.el  = portrait ? 0.30 : 0.32;
  STATION.wide.fov = portrait ? 60 : 46;
  STATION.wide.r   = portrait ? 10.4 : 7.0;
  STATION.wide.ty  = portrait ? 1.42 : 1.44;
  /* The panel station has to travel with home, or opening a section in
     landscape throws the camera back out to where it just came from. */
  STATION.panel.r  = portrait ? 8.6 : 6.2;
  STATION.panel.tx = portrait ? 2.1 : 1.9;
  STATION.panel.ty = portrait ? 1.62 : 1.52;
  camera.updateProjectionMatrix();
  /* re-issue the station, or the rig keeps easing toward the old one */
  if (!active && !intro.running) goto('home');

  /* an open panel sits on a different side in each orientation, so the
     framing follows a rotation. Only the camera — rebuilding the panel
     here would wipe form state every time a soft keyboard opens. */
  if (active) framePanel();
}


/* ───────────────────────────────────────────────────────────────
   7. BOOT
   ─────────────────────────────────────────────────────────────── */
function boot() {
  if (!hasWebGL()) return flatFallback('webgl');

  applyTier(detectTier());

  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(col(C.nightLo), 0.028);
  camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.1, 260);
  clock = new THREE.Clock();

  try {
    buildRenderer();
    buildSky();
    buildWater();
    buildLotus();
    buildBappa();
    buildAura();
    buildDiyas();
  } catch (err) {
    console.error('scene build failed', err);
    return flatFallback('build');
  }
  buildDock();

  /* Ambient carries the night; the diyas carry the warmth. The key rakes
     the flower from high on the left rather than sitting over the camera's
     shoulder — a frontal key lands flat on petals that are themselves
     nearly flat, and the whole flower turns into one pale wash. Off to the
     side it gives every petal a lit face and a shaded one, which is the
     only reason the layering reads at all. */
  scene.add(new THREE.HemisphereLight(col('#6B4A94'), col(C.patola), 0.60));
  var key = new THREE.PointLight(col('#FFE0B0'), 0.72, 16, 2);
  key.position.set(2.9, 4.3, 1.2);
  /* and a cool counter-light from behind right, at a third the strength,
     so the shaded halves are separated from each other instead of all
     falling into the same dark. Directional rather than a lamp: it reads
     as bounce off the night, and it costs the fragment shader less than a
     fifth point light would once the diyas have taken their three. */
  var rim = new THREE.DirectionalLight(col('#9C7CD8'), 0.34);
  rim.position.set(-3.4, 3.0, -2.6);
  scene.add(rim);
  if (Q.shadows) {
    key.castShadow = true;
    key.shadow.mapSize.set(512, 512);
    key.shadow.bias = -0.002;
  }
  scene.add(key);

  onResize();
  window.addEventListener('resize', onResize, { passive: true });
  window.addEventListener('orientationchange', function () { setTimeout(onResize, 120); });

  bindNav();

  canvas.addEventListener('pointerdown', onDown);
  window.addEventListener('pointermove', onMove, { passive: true });
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);
  window.addEventListener('mousemove', onHover, { passive: true });

  document.addEventListener('visibilitychange', function () {
    paused = document.hidden;
    if (!paused) clock.getDelta();       /* swallow the gap */
  });

  goto('home', true);
  rig.r = 14; rig.el = 0.66; rig.fov = 60;   /* start pulled back and high… */
  goto('home');                              /* …then settle in */

  renderer.setAnimationLoop(frame);

  document.getElementById('veil').classList.add('gone');

  /* exposed for verification: FPS, tier, and timeline scrubbing */
  window.__scene = {
    get tier() { return tier; },
    get fps() { return window.__fps; },
    get intro() { return intro.t; },
    goto: goto,
    rig: rig,
    open: openSection,
    close: closeSection,
    get active() { return active; },
    get navFade() { return dockLit ? 1 : 0; },
    get aarti() { return aartiT; },
    fireAarti: fireAarti,
    /* the quiz's live model, so a full round can be played and scored
       from a test without the answers being reachable from the page */
    get quiz() { return quiz; },
    /* project a world point to screen pixels, so framing can be
       measured rather than eyeballed off a screenshot */
    at: function (x, y, z) {
      var v = new THREE.Vector3(x, y, z).project(camera);
      return {
        x: Math.round((v.x * 0.5 + 0.5) * window.innerWidth),
        y: Math.round((-v.y * 0.5 + 0.5) * window.innerHeight)
      };
    },
    /* scrub the reveal so a mid-bloom frame can be inspected */
    seek: function (v) {
      intro.t = v; intro.running = true; intro.named = v >= 4.15;
      document.getElementById('nameplate').classList.toggle('lit', v >= 4.15);
      return v;
    },
    time: function (v) { if (v !== undefined) t0 = v; return t0; }
  };
}

function flatFallback(why) {
  buildFlat();
  document.getElementById('veil').classList.add('gone');
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('noweb').classList.add('on');
  document.documentElement.style.overflow = 'auto';
  document.body.style.overflow = 'auto';
  console.warn('falling back to flat layout:', why);
}

/* The no-WebGL page is not an apology screen — it carries all four
   destinations as plain HTML. Section views that build DOM (rather than
   geometry) are reused here verbatim. */
function buildFlat() {
  var host = document.getElementById('nowebBody');
  if (!host || host.childElementCount) return;
  SECTIONS.forEach(function (s) {
    var sec = document.createElement('section');
    var h = document.createElement('h2');
    h.textContent = s.gu;
    var p = document.createElement('p');
    p.textContent = s.sub;
    var body = document.createElement('div');
    body.className = 'body-' + s.id;
    if (VIEWS[s.id]) {
      try { VIEWS[s.id](body, true); } catch (err) { console.warn('flat view failed', s.id, err); }
    }
    sec.appendChild(h); sec.appendChild(p); sec.appendChild(body);
    host.appendChild(sec);
  });
}

if (window.THREE) {
  boot();
} else {
  /* three.min.js did not load — offline, or blocked. Say so, don't hang. */
  flatFallback('three-missing');
}

})();
</script>
